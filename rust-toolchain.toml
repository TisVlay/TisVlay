# Pinned to an exact stable release so a build reproduces from a git SHA alone
# (a floating "stable" silently changes the compiler under you). One file drives
# rustup and the Nix devShell — flake.nix reads it via rust-overlay's
# fromRustupToolchainFile. Bump deliberately; it may run ahead of the
# workspace `rust-version` in Cargo.toml, the oldest compiler the workspace
# supports (see the note there). Dependabot is not configured for either.
[toolchain]
channel = "1.99.0"
components = ["rust-analyzer", "rust-src"]
profile = "default"

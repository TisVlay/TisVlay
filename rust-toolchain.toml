# Pinned to an exact stable release so a build reproduces from a git SHA alone
# (a floating "stable" silently changes the compiler under you). One file drives
# both rustup and Nix — flake.nix reads it via rust-overlay's
# fromRustupToolchainFile. Bump deliberately, together with the workspace
# `rust-version` in Cargo.toml; Dependabot does not touch either.
[toolchain]
channel = "1.99.0"
components = ["rust-analyzer", "rust-src"]
profile = "default"

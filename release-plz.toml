# release-plz drives crates.io. On push to `main` it opens/updates a
# "release" PR that bumps the shared workspace version (`version.workspace`)
# and the per-crate CHANGELOGs (.github/workflows/release-plz.yml). Merging
# that PR lands the bump; the publish of the publishable crates
# (`publish = true`) to crates.io — in dependency order, skipping the
# `publish = false` crates (the binaries, their glue, the mock and the
# test fakes) — runs from
# .github/workflows/release.yml when you promote the GitHub release to a
# full release, i.e. AFTER you've verified the distro artifacts (crates.io
# is irreversible, so it comes last).
#
# `git_release_enable = false`: release-plz creates no GitHub release —
# `release.yml` owns that (the draft you cut on the `v*` tag). release-plz
# still makes its per-package `{{ package }}-v{{ version }}` git tags (its
# changelog anchors); those don't match `release.yml`'s `v*` trigger, so
# they don't re-fire the distro build. (A single `v{{ version }}` tag is
# not used: release-plz tags every published package, which would collide
# on a shared-version workspace.)
[workspace]
git_release_enable = false

# option-ext: MPL-2.0. See deny.toml for the full rationale.
[option-ext]
accepted = ["MPL-2.0"]

# generational-arena: MPL-2.0. Pulled in via Slint's renderers under
# `--all-features`; same MPL rationale as `option-ext`.
[generational-arena]
accepted = ["MPL-2.0"]

# libfuzzer-sys: NCSA via image -> ravif -> rav1e's fuzz feature.
# Not in shipped binaries; see deny.toml for the full rationale.
[libfuzzer-sys]
accepted = ["NCSA"]

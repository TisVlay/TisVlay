# cargo-about config — workspace-wide SPDX allow-list, OR-priority,
# and per-crate clarifications. Feeds the `about.html.hbs` template
# to produce `THIRD-PARTY-LICENSES.html` in two places:
#
#   1. As `/usr/share/doc/tisvlay/THIRD-PARTY-LICENSES.html` inside
#      each nfpm-built package — regenerated at the repo root by
#      `just licenses-html` before bundling.
#   2. Embedded into the GUI binary at compile time via
#      `crates/tisvlay-gui/build.rs` (`include_str!` against
#      `$OUT_DIR/THIRD-PARTY-LICENSES.html`) so the About pane's
#      "View third-party notices" button can hand off to the user's
#      browser even on a machine that doesn't have the packaged
#      attribution installed.

# Priority-ordered. cargo-about picks the FIRST match for `OR`
# expressions, so MIT wins on `MIT OR Apache-2.0`. This minimizes
# Apache-2.0 NOTICE-propagation work. See `docs/licensing.md`
# "License elections" for the rationale.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]

# Linux-only project. Pruning Windows/macOS-only crates keeps the
# bundle accurate for what we actually ship. Add more triples here
# when/if multi-platform packaging lands.
targets = [
    "x86_64-unknown-linux-gnu",
]

# cargo-about's built-in clarifications. The full upstream catalogue
# lives at https://github.com/EmbarkStudios/cargo-about/blob/main/docs/src/cli/generate/workarounds.md —
# review it on every dep-graph shift.
#
#   rustls    direct dep (LG WebSocket TLS)
#   ring     transitive via rustls; license file packs four texts
#   wasmtime  covers the LLVM-exception crates
#   rustix   transitive; triple-licensed with COPYRIGHT file quirk
workarounds = ["rustls", "ring", "wasmtime", "rustix"]

# Skip license checks on our own workspace crates. They're all
# `publish = false` per the workspace package metadata; without this
# cargo-about would either try to validate them against `accepted`
# or warn noisily about the unpublished status.
private = { ignore = true }

# Build-deps' generated output ships in our binaries, so they keep
# their attribution. Test-only crates don't ship and are excluded.
ignore-build-dependencies = false
ignore-dev-dependencies = true

# Per-crate license additions for crates whose expression includes
# something the global `accepted` list can't satisfy by itself.
# Mirrors `deny.toml`'s `exceptions` block — same rationale, separate
# vocabulary (cargo-about reads from this section; cargo-deny from
# `[licenses].exceptions`).
#
# Slint family: triple-licensed `GPL-3.0-only OR
# LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0`.
# We elect the Royalty-free option (which triggers the AboutSlint
# widget requirement satisfied by tisvlay-gui's About pane).
#
# Each crate also gets a `[<crate>.clarify]` block pointing at the
# Royalty-free license file shipped under `LICENSES/` in the
# published tarball. The checksum is identical across every Slint
# crate (single source-of-truth file at the workspace root,
# symlinked into each crate's LICENSES/ and resolved by `cargo
# publish`); when Slint amends the license text — rare; this is a
# legal document — the checksum fails closed and we re-confirm
# explicitly. See `docs/licensing.md` "Per-crate exceptions" for
# the upstream context.
#
# Note: until cargo-about EmbarkStudios/cargo-about#303 lands these
# clarify blocks are *parsed but not surfaced* in the rendered
# bundle. cargo-about's per-license iteration in `generate.rs`
# treats `LicenseRef-*` identifiers via the `LicenseItem::Other`
# arm, which currently ignores `license_files` entirely and emits
# a "no license file for crate" warning regardless. The PR makes
# the Other arm mirror the Spdx arm's filter so clarified files
# actually land in the output. The blocks below are kept anyway —
# forward-compatible config that starts working once the upstream
# PR ships.
#
# `i-slint-backend-testing` is intentionally absent from the
# `[<crate>.clarify]` blocks below: that crate's published tarball
# doesn't ship LICENSES/ at all (the source is missing the symlinks
# every sibling backend has — slint-ui/slint#11631 fixes that
# upstream). Until that lands and a new Slint version ships the
# file, the testing-backend crate falls back to the bare `accepted`
# clause and continues emitting one "no license file" warning.

[slint]
accepted = ["LicenseRef-Slint-Royalty-free-2.0"]
[slint.clarify]
license = "LicenseRef-Slint-Royalty-free-2.0"
[[slint.clarify.files]]
path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md"
checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe"


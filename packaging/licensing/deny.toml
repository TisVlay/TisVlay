# cargo-deny config — license-policy + multi-version-awareness gate.
# Pipeline rationale + maintenance reference: `docs/licensing.md`.
#
# `[licenses]` enforces the SPDX allow-list. `[bans]` fails on
# multi-version dep duplication, except for the curated skip-list of
# upstream-forced duplicates (each with its reason; bump routine in
# `docs/build.md` "Dep-graph posture").
# `[sources]` pins code provenance to crates.io and is gated by
# `just deny`. `[advisories]` gates RustSec/yanked crates but is
# deliberately NOT in `just deny` — it runs in a separate workflow
# (.github/workflows/audit.yml): weekly, so a newly-disclosed advisory
# against an unchanged pinned dep still surfaces, and on PRs that change
# Cargo.lock or this file, so a dependency update that pulls in an
# advisory is flagged on its own PR without gating unrelated ones on
# transitive vulnerabilities that have no upstream fix.

# Restrict resolution to the platforms we ship for. Without this,
# cargo-deny's default view considers every target triple and
# surfaces ~20 duplicate warnings for crates we never compile
# (objc2-* on Apple, windows-* / windows-targets on Windows,
# jni-sys on Android, r-efi / redox_* on niche targets). All
# workspace binaries are Linux-only — daemon/tray/CLI use D-Bus +
# systemd, GUI is Wayland-only since the share-target sprint.
#
# Default-feature resolution intentionally — matches the dep graph
# we actually ship. The MCP debug stack (`i-slint-backend-testing/mcp`'s
# prost chain, which contains crates we don't audit for production, e.g.
# `generational-arena` under MPL-2.0) is reachable only via an ad-hoc
# `cargo run --features slint/mcp` — a `slint` dependency feature that no
# workspace crate enables — so it is absent from both default- and
# all-feature resolution and never reaches the licenses check.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[licenses]
# Near-mirror of about.toml's `accepted` list. The two configs'
# per-crate exception sets can differ in one direction (cargo-about
# resolves with `--workspace --all-features`; cargo-deny doesn't),
# so crates surfaced only by cargo-about don't need entries here —
# adding them would just emit "license-exception-not-encountered"
# warnings. When a new crate fails `just deny`, mirror the exception
# in *both* files.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]

# 0.93 is cargo-deny's default; raise only if we hit a misclassified
# license file in practice.
confidence-threshold = 0.93

# Per-crate exceptions for crates whose license expression isn't
# fully covered by the global `allow` set. Each entry's rationale
# lives in `docs/licensing.md` "Per-crate exception catalog".
exceptions = [
    { name = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "slint-build", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-backend-testing", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { name = "option-ext", allow = ["MPL-2.0"] },
    # Valve's HDMI-CEC library + its proc-macro helper, used by the
    # tisvlay-cec backend. LGPL-2.1 weak copyleft; the static-relink
    # obligation is satisfied by tisvlay being open source. linux-cec-sys
    # (the ioctl bindings) is BSD-3 and needs no exception.
    { name = "linux-cec", allow = ["LGPL-2.1-or-later"] },
    { name = "linux-cec-macros", allow = ["LGPL-2.1-or-later"] },
]

# Multi-version dep duplication. `deny`: a new duplicate fails `just deny`
# until it is deduplicated or skipped with a reason. The `skip` list
# documents already-evaluated cases — re-audit when the upstream consumer
# moves (Slint bumps, rustls/ring updates, etc.). Bump routine and
# background: `docs/build.md` "Dep-graph posture".
[bans]
multiple-versions = "deny"
skip = [
    # Slint compiler internals — `i-slint-compiler` → `rowan` pins
    # 0.14; `prost-build` → `petgraph` (via `i-slint-backend-testing`'s
    # `mcp` feature) pins 0.15. Re-audit on Slint bump.
    { crate = "hashbrown", reason = "Slint compiler (rowan / prost-build's petgraph)" },

    # rustls/ring keeps `getrandom 0.2`. Switching to aws-lc-rs
    # changes the dep graph but isn't obviously a win.
    { crate = "getrandom", reason = "rustls/ring keeps getrandom 0.2" },

    # winit 0.30 (Slint's `unstable-winit-030` backend) pins SCTK
    # 0.19 → `calloop 0.13`, which keeps rustix 0.38 and thiserror 1
    # alongside the rest of the tree's rustix 1 / thiserror 2.
    # Re-audit on Slint / winit upgrade.
    { crate = "rustix", reason = "winit's SCTK 0.19 path keeps rustix 0.38" },
    { crate = "linux-raw-sys", reason = "rustix 0.38 counterpart" },
    { crate = "thiserror", reason = "winit's SCTK 0.19 path (and freedesktop-icons) keep thiserror 1" },
    { crate = "thiserror-impl", reason = "thiserror's proc-macro counterpart" },

    # Slint's `resvg` pins `tiny-skia 0.12`; `sctk-adwaita` (via
    # SCTK 0.19) pins `tiny-skia 0.11`.
    { crate = "tiny-skia", reason = "resvg 0.12 vs sctk-adwaita 0.11 (SCTK 0.19 path)" },
    { crate = "tiny-skia-path", reason = "tiny-skia counterpart" },

    # Smaller offenders — single-line attribution lookup hasn't
    # surfaced an obvious upstream lever, but compile cost is
    # negligible. Re-audit if any of these become hot.
    { crate = "dirs-sys", reason = "transitive churn; low compile cost" },
    { crate = "foldhash", reason = "transitive churn; low compile cost" },
    { crate = "smol_str", reason = "transitive churn; low compile cost" },

    # Exact-version skips: each names the OLDER version and the upstream
    # crate pinning it, so the entry goes stale — and `just deny` fails on
    # it (unnecessary-skip) — once that upstream catches up.

    # zenoh 1.10's dependency floor.
    { crate = "itertools@0.14.0", reason = "zenoh 1.10 pins itertools 0.14; Slint/femtovg are on 0.15" },
    { crate = "nix@0.29.0", reason = "zenoh-link-unixsock_stream pins nix 0.29" },
    { crate = "rand@0.8.8", reason = "zenoh-keyexpr pins rand 0.8; tungstenite is on 0.10" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8 counterpart (zenoh-keyexpr)" },
    { crate = "socket2@0.5.10", reason = "zenoh pins socket2 0.5; tokio and our WoL use 0.6" },
    { crate = "toml@0.9.12", reason = "zenoh-config pins toml 0.9; the workspace is on 1.x" },
    { crate = "toml_datetime@0.7.5", reason = "toml 0.9 counterpart (zenoh-config)" },
    { crate = "winnow@0.7.15", reason = "toml 0.9 counterpart (zenoh-config)" },
    { crate = "secrecy@0.8.0", reason = "zenoh-config pins secrecy 0.8 (public SecretValue); the workspace is on 0.10" },
    { crate = "spin@0.9.9", reason = "flume 0.11 (zenoh's channel) pins spin 0.9; bevy_platform is on 0.12" },
    { crate = "spin@0.10.1", reason = "uhlc 0.8 (zenoh's timestamps) pins spin 0.10; bevy_platform is on 0.12" },
    # zenoh-crypto's RustCrypto 0.10 stack (hmac/sha3/aes/cipher) vs
    # tungstenite's sha1 0.11.
    { crate = "digest@0.10.7", reason = "zenoh-crypto's hmac/sha3 are on digest 0.10; tungstenite's sha1 is on 0.11" },
    { crate = "block-buffer@0.10.4", reason = "digest 0.10 counterpart (zenoh-crypto)" },
    { crate = "crypto-common@0.1.7", reason = "digest 0.10 / cipher 0.4 counterpart (zenoh-crypto)" },
    { crate = "cpufeatures@0.2.17", reason = "aes 0.8 (zenoh-crypto) pins cpufeatures 0.2" },

    # Everything else.
    { crate = "gettext-rs@0.7.7", reason = "Slint's i-slint-core pins gettext-rs 0.7; ours stays on 0.8 for the RUSTSEC-2026-0244 fix" },
    { crate = "nix@0.30.1", reason = "rtnetlink 0.23 pins nix 0.30; linux-cec and os_info are on 0.31" },
    { crate = "libloading@0.8.9", reason = "dlib/glutin/x11rb/zenoh on libloading 0.8; pipewire-native-spa on 0.9" },
    { crate = "syn@2.0.119", reason = "bevy's macros and other proc-macro crates are still on syn 2" },
    { crate = "dirs@5.0.1", reason = "freedesktop-icons 0.4 pins dirs 5; shellexpand is on 6" },
    { crate = "downcast-rs@1.2.1", reason = "wayland-backend pins downcast-rs 1; bevy_reflect is on 2" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 (Slint's image stack) pins miniz_oxide 0.8; flate2 is on 0.9" },
    { crate = "rustc-hash@1.1.0", reason = "rowan 0.17 (Slint's compiler) pins rustc-hash 1; bevy's variadics_please (via unsynn) is on 2" },
]

# RustSec advisory + yanked-crate gate. Run by the audit workflow
# (.github/workflows/audit.yml), NOT by `just deny` — see the file header.
# The ignore-list records advisories already triaged against the current
# lockfile so the audit run stays green until a NEW advisory lands; each
# entry carries a reason. Drop an entry once a dep bump clears it.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Unmaintained, no safe upgrade — accepted:
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained; no safe upgrade; transitive" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; no safe upgrade; transitive proc-macro" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; no safe upgrade; unconditional via zenoh-config 1.10/serde_yaml; TisVlay builds Zenoh config programmatically, not from YAML; revisit on Zenoh bump" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; no safe upgrade; transitive via winit sctk-adwaita" },
    # zbus 6 absorbed its helper crates, which zbus 5 still depends on.
    # ashpd, slint's winit backend, ksni and notify-rust are all on zbus 5,
    # as are our consumed-D-Bus adapters (through zbus's re-exports, never
    # directly); revisit together on the zbus 6 migration.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6 as its wire module); no safe upgrade; via zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6 as its names module); no safe upgrade; via zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6); no safe upgrade; via zbus 5" },
    # Fix available upstream — deferred to a dependency bump:
    { id = "RUSTSEC-2026-0041", reason = "lz4_flex decompression memory leak; fixed >=0.11.6/>=0.12.1; transitive, pending bump" },
]

# Code provenance: crates.io only. Any git or alternate-registry
# dependency fails the gate — a tripwire against an unvetted source
# sneaking in. Gated by `just deny`.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[workspace]
resolver = "2"
members = [
    "crates/tisvlay-core",
    "crates/tisvlay-cli",
    "crates/tisvlayd",
    "crates/tisvlay-session",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["ruffsl <roxfoxpox@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/ruffsl/tisvlay"
repository = "https://github.com/ruffsl/tisvlay"
keywords = ["remote", "lg", "tv", "linux", "webos"]
categories = ["command-line-utilities", "hardware-support"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
webpki-roots = "0.26"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# D-Bus (tokio feature ensures zbus uses tokio runtime instead of async-io)
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Networking (for WoL)
socket2 = "0.5"

# XDG directories
directories = "5"

# SSDP discovery
ssdp-client = "2"
urlencoding = "2"
url = "2"

# Wayland (for idle detection)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# Internal crates
tisvlay-core = { path = "crates/tisvlay-core" }

[workspace.metadata.deb]
section = "utils"

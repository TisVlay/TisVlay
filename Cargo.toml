[workspace]
resolver = "3"
members = [
    "crates/tisvlay-core",
    "crates/tisvlay-ssdp",
    "crates/tisvlay-lg",
    "crates/tisvlay-mock",
    "crates/tisvlay-cec",
    "crates/tisvlay-test",
    "crates/tisvlay-protocol",
    "crates/tisvlay-world",
    "crates/tisvlay-icons",
    "crates/tisvlay-runtime",
    "crates/tisvlay",
    "crates/tisvlay-cli",
    "crates/tisvlay-daemon",
    "crates/tisvlay-session",
    "crates/tisvlay-greeter",
    "crates/tisvlay-tray",
    "crates/tisvlay-gui",
    "crates/tisvlay-gui-app",
]

# `default-members` = the shipping binary crates. Bare `cargo build` /
# `cargo test` (without `--workspace`) scope to these + their dependency
# closure, so the justfile and packaging/nix consume one list instead of
# each repeating it as `-p` flags. Use `just check` or `--workspace` to
# build/test the whole tree (every dev/CI path does). The separate
# crates.io publish set is tracked per-crate via `publish = true` (the
# workspace default below is `publish = false`).
default-members = [
    "crates/tisvlay-daemon",
    "crates/tisvlay-cli",
    "crates/tisvlay-session",
    "crates/tisvlay-greeter",
    "crates/tisvlay-tray",
    "crates/tisvlay-gui-app",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
# MSRV = the oldest rustc the workspace actually builds on, verified by
# `just msrv` and the CI `msrv` job (both read this value). It must never
# exceed the rustc nixos-unstable ships: the Nix package, and so the NixOS
# module, builds with the consumer's nixpkgs compiler, and Cargo refuses
# any toolchain below this floor. The MSRV-aware resolver holds
# dependencies to releases that support it, so raise it deliberately when
# an update needs a newer compiler. The dev/CI pin in rust-toolchain.toml
# runs ahead independently.
rust-version = "1.95"
authors = ["ruffsl <roxfoxpox@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/ruffsl/tisvlay"
repository = "https://github.com/ruffsl/tisvlay"
# All crates are unpublished by default; individual crates override with
# `publish = true` when ready for crates.io.
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }

# WebSocket
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = { version = "0.10", features = ["serde"] }
toml = "1.1"
# Format-preserving TOML: the state writers keep a hand edit's comments and
# layout across their writes.
toml_edit = "0.25"

# The system's monospace family for the GUI (the font library Slint uses;
# kept on the version Slint pins so the graph holds one copy).
fontique = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Bitflags
bitflags = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "registry"] }
tracing-journald = "0.3"
# tracing-log gives us LogTracer::builder().ignore_crate(...) to drop
# noisy `log::warn!()` calls from transitive deps (e.g.
# netlink-packet-route's IFLA_INET6_CONF kernel-skew warning) AT THE
# BRIDGE LEVEL, where the original module-path target is still
# available — EnvFilter directives on the original path can't match,
# because the bridged tracing event's target becomes the literal
# string "log". See logging::init for the install order and
# tokio-rs/tracing#3059 for the unresolved upstream paper-cut.
tracing-log = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }
# Minor-anchored like zenoh: the `unstable-dynamic` completion engine
# churns across minor releases, so don't let a bare "4" pull a changed
# surface on `cargo update`.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

# D-Bus (tokio feature ensures zbus uses tokio runtime instead of async-io)
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Networking (for WoL)
socket2 = "0.6"

# Sync primitives without poisoning. Used for short, non-`.await`
# critical sections that guard small data structures (HashMaps,
# Vecs, RefCells around plain state). The std `Mutex` poisoning
# behavior is intentionally elided — a panic-while-holding implies
# a logic bug we want to surface, not transient state to recover
# from, and our critical sections are panic-free by inspection
# (HashMap ops on owned strings + channel senders). For locks
# held across `.await` we still use `tokio::sync::Mutex`.
parking_lot = "0.12"

# XDG directories
directories = "6"

# UUID v4 for stable per-TV identifiers (decoupled from user-facing
# display name so renames don't churn cross-references). Matches
# NetworkManager's connection-uuid pattern.
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# SSDP discovery support (the multicast transport itself lives in
# the in-workspace `tisvlay-ssdp` crate).
urlencoding = "2"
url = "2"
async-stream = "0.3"
futures-core = "0.3"

# Wayland (for idle detection / greeter wake)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# PipeWire graph introspection (the session's screencast detector). Native
# Rust protocol client — no libpipewire link. 0.2 is the floor: 0.1.4
# aborts inside an FFI callback on a protocol decode error against
# PipeWire ≥ 1.4.
pipewire-native = "0.2"

# HDMI-CEC (Linux CEC subsystem). Valve's linux-cec from crates.io.
# `async` enables the tokio `AsyncDevice` wrapper. Default features
# (`cectool`, `tracing`) are dropped to avoid the clap pull and the bundled
# CLI binary. LGPL-2.1 — carried via a per-crate exception in
# packaging/licensing.
linux-cec = { version = "0.2", default-features = false, features = ["async"] }

# ABI-stable `EACCES` / `EPERM` constants to classify a `/dev/cecN` open
# failure that `linux-cec` surfaces as `Error::SystemError(errno)`. Matching
# the raw errno value against `libc` (rather than naming `nix::Errno`
# variants) avoids pinning to whatever `nix` major `linux-cec` transitively
# selects.
libc = { version = "0.2", default-features = false }

# ECS world engine (the daemon's state machines)
bevy_ecs = "0.20"

# Zenoh IPC (replaces the served-D-Bus surface). The advanced pub/sub
# API (caches, history, recovery) is behind `unstable` — an accepted
# risk, watched in docs/build.md § Review triggers.
#
# Every TisVlay link is a Unix socket, so zenoh's default transports (QUIC,
# TLS, WebSocket, TCP, UDP, compression, multilink, pubkey/usrpwd auth) are
# switched off — on zenoh-ext too, whose `default` re-enables them. Add a
# `transport_*` feature back here if a link ever needs one.
zenoh = { version = "1.10", default-features = false, features = ["transport_unixsock-stream"] }
# Tilde, not caret: the `unstable` feature switches on zenoh's unstable
# and internal APIs, which may break within 1.x, so a newer minor could
# break the published SDK downstream. Bump it deliberately
# (docs/build.md § Review triggers).
zenoh-ext = { version = "~1.10", default-features = false, features = ["unstable"] }

# EDID parsing for the DRM connector ↔ TV matcher
edidkit = "0.1"

# System tray (StatusNotifierItem)
ksni = "0.3"

# Slint GUI toolkit, shared by tisvlay-gui (the compiled UI) and
# tisvlay-gui-app (the code driving it). Wayland-only winit backend: the
# session stack is Wayland-only, and dropping the X11 backend keeps x11rb
# off the cold-build path. `unstable-winit-030` is a preliminary API, so
# slint is pinned exactly — bump it together with slint-build and
# i-slint-backend-testing, re-checking the winit-030 call sites.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-wayland", "compat-1-2", "renderer-femtovg", "gettext", "unstable-winit-030"] }

# Freedesktop icon-theme lookup (name → file path), shared by the GUI
# and tray via tisvlay-icons.
freedesktop-icons = "0.4"

# Desktop notifications (z-with-tokio keeps zbus/tokio, drops the
# default async-io stack)
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }

# Kernel netlink: route resolution + carrier/route monitoring
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
rtnetlink = "0.23"

# Internal crates. Published crates carry both `path` and `version`, so
# the entries work for local dev (path wins) and for `cargo publish` (the
# version is used once the path is stripped). Unpublished crates
# (`publish = false`) are path-ONLY: a *versioned* dev-dependency on one
# is kept in the published manifest and would demand an unpublished crate
# from crates.io, whereas a path-only dev-dependency is dropped on publish.
tisvlay-core = { path = "crates/tisvlay-core", version = "0.3.0" }
tisvlay-ssdp = { path = "crates/tisvlay-ssdp", version = "0.3.0" }
tisvlay-lg = { path = "crates/tisvlay-lg", version = "0.3.0" }
tisvlay-mock = { path = "crates/tisvlay-mock" }
tisvlay-cec = { path = "crates/tisvlay-cec", version = "0.3.0" }
tisvlay-test = { path = "crates/tisvlay-test" }
tisvlay-protocol = { path = "crates/tisvlay-protocol", version = "0.3.0" }
tisvlay-world = { path = "crates/tisvlay-world" }
tisvlay-icons = { path = "crates/tisvlay-icons" }
tisvlay-runtime = { path = "crates/tisvlay-runtime" }
tisvlay-gui = { path = "crates/tisvlay-gui" }
tisvlay = { path = "crates/tisvlay", version = "0.3.0" }
# Binary crates exposed as libs for cross-crate integration tests.
tisvlay-daemon = { path = "crates/tisvlay-daemon" }
tisvlay-session = { path = "crates/tisvlay-session" }

# Testing
proptest = "1"
rstest = "0.27"
tempfile = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tracing-mock = "0.1.0-beta.3"

[workspace.metadata.deb]
section = "utils"

# Centralized lint policy. Each crate opts in with `[lints] workspace =
# true`. Adjust here, not per-crate. The gates deny every warning, so a
# lint at "warn" here blocks like "deny"; the rules for adding a lint are
# in docs/build.md § Lint policy.
[workspace.lints.rust]
unreachable_pub = "warn"
missing_debug_implementations = "warn"
# `unsafe` is confined to the files that need it (libc ACL and user-database
# calls, the logind FFI, the glibc version probe, the session's
# SPA_PLUGIN_DIR setup, the test fakes); each carries a reasoned
# `#![expect(unsafe_code)]`, so a new `unsafe` anywhere else is refused.
# `deny`, not `forbid`: `forbid` would reject those exceptions.
unsafe_code = "deny"
unused_qualifications = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# Every allowance states why (`#[expect(…, reason = "…")]` preferred).
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# `process::exit` outside `main` skips destructors; `main` is exempt.
exit = "warn"
get_unwrap = "warn"
# Binaries and libraries log through tracing; the CLI, which prints its
# output, opts out at its crate root. `println!` also panics on a closed pipe.
print_stdout = "warn"
print_stderr = "warn"
# A panic in shipped code states its invariant: `expect("… because …")`,
# never a bare `unwrap()`. Tests may unwrap and panic (clippy.toml; the
# integration-test roots opt out, since clippy can't see their helpers).
unwrap_used = "warn"
panic = "warn"
# Hand-picked pedantic and nursery lints, each on its merits: never the
# groups (docs/build.md "Adding a lint").
cast_lossless = "warn"
borrow_as_ptr = "warn"
ignored_unit_patterns = "warn"
manual_let_else = "warn"
ptr_as_ptr = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

# `split-debuginfo = "unpacked"` keeps debug info in sibling .o files
# instead of inside the linked artifact — relinks don't have to copy
# debuginfo, which is the dominant cost on incremental rebuilds. Linux
# default is "off" (everything inlined), so we set it explicitly.
[profile.dev]
split-debuginfo = "unpacked"

# Test profile inherits `split-debuginfo` from `dev`. `debug =
# "line-tables-only"` keeps file:line in panic backtraces but drops
# type info, shrinking object files significantly. `just check` /
# `just test-ci` and `cargo test` all run under this profile, so the
# win compounds across the build → clippy → test pipeline. `cargo run`
# still uses `dev` (full debug) for interactive lldb sessions.
[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

# Tuning for shipped binaries (Nix, musl release, .deb/.rpm/.archlinux).
# Cargo's default codegen units and no LTO, on purpose: `codegen-units = 1`
# serializes each crate's optimization (zenoh and the Slint-generated GUI
# stall the whole build on one core), and thin LTO adds a mostly serial
# pass per binary. TisVlay waits on sockets, D-Bus and timers, so the
# cross-crate inlining those buy isn't worth a build ~30% slower.
[profile.release]
strip = "symbols"

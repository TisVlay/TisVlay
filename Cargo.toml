[package]
name = "orlgtv"
version = "0.0.1"
authors = ["ruffsl <roxfoxpox@gmail.com>"]
edition = "2024"
rust-version = "1.91.1"
description = "Open Remote for LG TVs on Linux"
documentation = "https://docs.rs/orlgtv/"
readme = "README.md"
homepage = "https://github.com/ruffsl/orlgtv"
repository = "https://github.com/ruffsl/orlgtv"
license = "Apache-2.0"
keywords = [
    "remote",
    "lg",
    "tv",
    "linux",
]
categories = ["command-line-utilities", "hardware-support"]
exclude = [
    ".envrc",
    ".github/",
    ".vscode/",
    "docs/",
    "flake.*",
    "flatpak/",
    "rust-toolchain.toml",
]

[badges]
github = { repository = "ruffsl/orlgtv" }

[dependencies]
clap = { version = "^4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
signal-hook = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

# dependencies for system tray
ashpd = "0.12"
futures = "0.3"
futures-util = "0.3"
ksni = "^0.3.3"
notify-rust = "4.11"
parking_lot = "0.12"
serde = "1"
toml = "0.9"

[package.metadata.deb]
section = "utils"

# [profile.release]
# codegen-units = 1
# lto = true
# opt-level = "z"
# strip = true

[workspace]
resolver = "3"
members = [
    "crates/tisvlay-core",
    "crates/tisvlay-ssdp",
    "crates/tisvlay-lg",
    "crates/tisvlay-mock",
    "crates/tisvlay-cec",
    "crates/tisvlay-test",
    "crates/tisvlay-backends",
    "crates/tisvlay",
    "crates/tisvlay-cli",
    "crates/tisvlayd",
    "crates/tisvlay-session",
    "crates/tisvlay-greeter",
    "crates/tisvlay-tray",
    "crates/tisvlay-gui",
    "crates/tisvlay-harness",
]

# `default-members` = the shipping binary crates. Bare `cargo build` /
# `cargo test` (without `--workspace`) scope to these + their dependency
# closure, so the justfile and packaging/nix consume one list instead of
# each repeating it as `-p` flags. Use `just check` or `--workspace` to
# build/test the whole tree (every dev/CI path does). The separate
# crates.io publish set is tracked per-crate via `publish = true` (the
# workspace default below is `publish = false`).
default-members = [
    "crates/tisvlayd",
    "crates/tisvlay-cli",
    "crates/tisvlay-session",
    "crates/tisvlay-greeter",
    "crates/tisvlay-tray",
    "crates/tisvlay-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
authors = ["ruffsl <roxfoxpox@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/ruffsl/tisvlay"
repository = "https://github.com/ruffsl/tisvlay"
keywords = ["remote", "lg", "tv", "linux", "webos"]
categories = ["command-line-utilities", "hardware-support"]
# All crates are unpublished by default; individual crates override with
# `publish = true` when ready for crates.io.
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }

# WebSocket
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Bitflags
bitflags = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "registry"] }
tracing-journald = "0.3"
# tracing-log gives us LogTracer::builder().ignore_crate(...) to drop
# noisy `log::warn!()` calls from transitive deps (e.g.
# netlink-packet-route's IFLA_INET6_CONF kernel-skew warning) AT THE
# BRIDGE LEVEL, where the original module-path target is still
# available — EnvFilter directives on the original path can't match,
# because the bridged tracing event's target becomes the literal
# string "log". See logging::init for the install order and
# tokio-rs/tracing#3059 for the unresolved upstream paper-cut.
tracing-log = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# D-Bus (tokio feature ensures zbus uses tokio runtime instead of async-io)
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Networking (for WoL)
socket2 = "0.6"

# Sync primitives without poisoning. Used for short, non-`.await`
# critical sections that guard small data structures (HashMaps,
# Vecs, RefCells around plain state). The std `Mutex` poisoning
# behavior is intentionally elided — a panic-while-holding implies
# a logic bug we want to surface, not transient state to recover
# from, and our critical sections are panic-free by inspection
# (HashMap ops on owned strings + channel senders). For locks
# held across `.await` we still use `tokio::sync::Mutex`.
parking_lot = "0.12"

# XDG directories
directories = "6"

# Ordered map (preserves insertion order for TV list stability)
indexmap = "2"

# UUID v4 for stable per-TV identifiers (decoupled from user-facing
# display name so renames don't churn cross-references). Matches
# NetworkManager's connection-uuid pattern.
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# SSDP discovery support (the multicast transport itself lives in
# the in-workspace `tisvlay-ssdp` crate).
urlencoding = "2"
url = "2"
async-stream = "0.3"
futures-core = "0.3"

# Wayland (for idle detection / greeter wake)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# HDMI-CEC (Linux CEC subsystem). Valve's linux-cec from crates.io.
# `async` enables the tokio `AsyncDevice` wrapper; default features
# (`cectool`, `tracing`) are dropped to avoid the clap pull and the
# bundled CLI binary. LGPL-2.1 — carried via a per-crate exception in
# packaging/licensing.
linux-cec = { version = "0.2", default-features = false, features = ["async"] }

# Internal crates. Published crates carry both `path` and `version`, so
# the entries work for local dev (path wins) and for `cargo publish` (the
# version is used once the path is stripped). The dev-only crates
# (`tisvlay-test` / `tisvlay-harness`, `publish = false`) are path-ONLY:
# a *versioned* dev-dependency on them is kept in the published manifest
# and would demand an unpublished crate from crates.io, whereas a
# path-only dev-dependency is dropped on publish.
tisvlay-core = { path = "crates/tisvlay-core", version = "0.1.0" }
tisvlay-ssdp = { path = "crates/tisvlay-ssdp", version = "0.1.0" }
tisvlay-lg = { path = "crates/tisvlay-lg", version = "0.1.0" }
tisvlay-mock = { path = "crates/tisvlay-mock", version = "0.1.0" }
tisvlay-cec = { path = "crates/tisvlay-cec", version = "0.1.0" }
tisvlay-test = { path = "crates/tisvlay-test" }
tisvlay-backends = { path = "crates/tisvlay-backends", version = "0.1.0" }
tisvlay-harness = { path = "crates/tisvlay-harness" }
# Binary crates exposed as libs for the harness. `tisvlay-tray` is
# currently bin-only; add here when its lib surface is exposed.
tisvlayd = { path = "crates/tisvlayd", version = "0.1.0" }
tisvlay-session = { path = "crates/tisvlay-session", version = "0.1.0" }
tisvlay-gui = { path = "crates/tisvlay-gui", version = "0.1.0" }

# Testing
insta = { version = "1", features = ["json", "yaml", "filters"] }
insta-cmd = "0.7"
proptest = "1"
rstest = "0.26"
tempfile = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tracing-mock = "0.1.0-beta.3"

[workspace.metadata.deb]
section = "utils"

# Centralized lint policy. Each crate opts in with `[lints] workspace =
# true`. Adjust here, not per-crate.
[workspace.lints.rust]
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# `split-debuginfo = "unpacked"` keeps debug info in sibling .o files
# instead of inside the linked artifact — relinks don't have to copy
# debuginfo, which is the dominant cost on incremental rebuilds. Linux
# default is "off" (everything inlined), so we set it explicitly.
[profile.dev]
split-debuginfo = "unpacked"

# Test profile inherits `split-debuginfo` from `dev`. `debug =
# "line-tables-only"` keeps file:line in panic backtraces but drops
# type info, shrinking object files significantly. `just check` /
# `just test-ci` and `cargo test` all run under this profile, so the
# win compounds across the build → clippy → test pipeline. `cargo run`
# still uses `dev` (full debug) for interactive lldb sessions.
[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

# Tuning for shipped binaries (Nix, musl release, .deb/.rpm/.archlinux).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

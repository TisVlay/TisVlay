[workspace]
resolver = "2"
members = [
    "crates/tisvlay-core",
    "crates/tisvlay-lg",
    "crates/tisvlay-backends",
    "crates/tisvlay-cli",
    "crates/tisvlayd",
    "crates/tisvlay-session",
    "crates/tisvlay-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
authors = ["ruffsl <roxfoxpox@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/ruffsl/tisvlay"
repository = "https://github.com/ruffsl/tisvlay"
keywords = ["remote", "lg", "tv", "linux", "webos"]
categories = ["command-line-utilities", "hardware-support"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }

# WebSocket
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
webpki-roots = "1.0"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Bitflags
bitflags = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "registry"] }
tracing-journald = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# D-Bus (tokio feature ensures zbus uses tokio runtime instead of async-io)
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Networking (for WoL)
socket2 = "0.6"

# XDG directories
directories = "6"

# Ordered map (preserves insertion order for TV list stability)
indexmap = "2"

# SSDP discovery
ssdp-client = "2"
urlencoding = "2"
url = "2"

# Wayland (for idle detection)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# Internal crates
tisvlay-core = { path = "crates/tisvlay-core" }
tisvlay-lg = { path = "crates/tisvlay-lg" }
tisvlay-backends = { path = "crates/tisvlay-backends" }

# Testing
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"
rstest = "0.26"

[workspace.metadata.deb]
section = "utils"

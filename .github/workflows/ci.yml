name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: |
          rustup component add llvm-tools-preview
          rustup show

      # Tools whose output can differ between releases (formatters, linters,
      # dictionaries) are pinned to the flake's versions so local and CI
      # agree; bump them together after a `nix flake update`.
      - name: Setup
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-about@0.9.1
            cargo-deny@0.20.2
            cargo-llvm-cov
            cargo-nextest
            cargo-sbom@0.10.0
            cargo-shear@1.13.4
            just
            typos@1.50.2

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Save the cache even when subsequent steps fail. Without this,
          # a flaky test or a coverage-ratchet failure wipes the warm
          # target/ tarball and the next run pays the full cold cost.
          cache-on-failure: true

      - name: Lint
        uses: j178/prek-action@v2
        with:
          extra-args: >-
            --all-files
            --skip build
            --skip clippy
            --skip test

      # Single instrumented build for clippy + tests + doc tests +
      # coverage report — see `just test-ci` and `docs/build.md`
      # "Build pipeline" for the show-env design.
      - name: Test
        run: just test-ci

      # TODO: Enable Codecov upload once the repository is public.
      # Codecov is free for OSS, gives PR diff annotations, and tracks
      # coverage trends over time.
      #
      # - name: Upload to Codecov
      #   uses: codecov/codecov-action@v6
      #   with:
      #     files: lcov.info
      #     fail_ci_if_error: true
      #     token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

      # Whole-workspace SBOM (SPDX) as a build artifact. Generated from
      # Cargo.lock (no build needed); `!cancelled()` mirrors the coverage
      # upload so it is captured even when a later step fails.
      - name: SBOM
        if: ${{ !cancelled() }}
        run: just sbom

      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: target/sbom/
          retention-days: 14

      # NOTE: When this repo becomes public, fork PRs cannot create check
      # runs (read-only token). See the "Recommended setup for public
      # repositories" section of the dorny/test-reporter README — the
      # workflow_run pattern with two workflows is the workaround.
      # hashFiles guard: if a step before nextest failed there is no JUnit
      # file, and without it the reporter logs a confusing "no report files"
      # line over the real failure (it is already fail-on-error: false).
      - name: Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && hashFiles('target/nextest/ci/junit.xml') != '' }}
        with:
          name: Tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false
          list-suites: failed
          list-tests: failed

  # The workspace must build on its declared `rust-version` floor. The floor
  # is read from Cargo.toml, so this job never needs editing; rustup installs
  # it beside the pinned dev toolchain. No --ignore-rust-version: a
  # dependency that outgrows the floor fails here. Reproduce locally with
  # `just msrv` (Nix-provided toolchain).
  msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          # "1.95" means 1.95.0; rustup would otherwise take the latest patch.
          case "$msrv" in *.*.*) ;; *) msrv="$msrv.0" ;; esac
          rustup toolchain install "$msrv" --profile minimal
          # Overrides rust-toolchain.toml for every later step, rust-cache
          # included, so it neither installs the dev pin nor keys on it.
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

  # Every other gate builds with --all-features; this one builds each crate
  # with each feature on its own (and with none), so a crate that no longer
  # compiles with a feature off is caught. Same recipe as locally.
  features:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Setup
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-hack
            just

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: features

      - name: Check each feature
        run: just hack

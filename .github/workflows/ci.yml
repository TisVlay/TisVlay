name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: rustup show

      - name: Setup
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-nextest
            just

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint
        uses: j178/prek-action@v2
        with:
          extra-args: >-
            --all-files
            --skip build
            --skip clippy
            --skip test

      - name: Build
        run: just build

      - name: Clippy
        run: just clippy

      - name: Test
        run: just test-ci

      # NOTE: When this repo becomes public, fork PRs cannot create check
      # runs (read-only token). See the "Recommended setup for public
      # repositories" section of the dorny/test-reporter README — the
      # workflow_run pattern with two workflows is the workaround.
      - name: Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false
          list-suites: failed
          list-tests: failed

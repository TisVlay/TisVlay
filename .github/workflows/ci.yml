name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: |
          rustup component add llvm-tools-preview
          rustup show

      - name: Setup
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-about
            cargo-deny
            cargo-llvm-cov
            cargo-nextest
            just

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Save the cache even when subsequent steps fail. Without this,
          # a flaky test or a coverage-ratchet failure wipes the warm
          # target/ tarball and the next run pays the full cold cost.
          cache-on-failure: true

      - name: Lint
        uses: j178/prek-action@v2
        with:
          extra-args: >-
            --all-files
            --skip build
            --skip clippy
            --skip test

      # Single instrumented build for clippy + tests + doc tests +
      # coverage report — see `just test-ci` and
      # `docs/plans/ci-shared-target.md` for the show-env design.
      - name: Test
        run: just test-ci

      # TODO: Enable Codecov upload once the repository is public.
      # Codecov is free for OSS, gives PR diff annotations, and tracks
      # coverage trends over time.
      #
      # - name: Upload to Codecov
      #   uses: codecov/codecov-action@v6
      #   with:
      #     files: lcov.info
      #     fail_ci_if_error: true
      #     token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

      # NOTE: When this repo becomes public, fork PRs cannot create check
      # runs (read-only token). See the "Recommended setup for public
      # repositories" section of the dorny/test-reporter README — the
      # workflow_run pattern with two workflows is the workaround.
      - name: Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false
          list-suites: failed
          list-tests: failed

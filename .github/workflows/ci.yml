name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Toolchain
        run: rustup show
      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Lint
        uses: j178/prek-action@v2
        with:
          extra-args: >-
            --all-files
            --skip cargo-build,cargo-clippy,cargo-test
      - name: Build
        run: >-
          cargo build
          --profile test
          --workspace
          --all-targets
          --all-features
      - name: Clippy
        run: >-
          cargo clippy
          --profile test
          --workspace
          --all-targets
          --all-features
          -- -D warnings
      - name: Test
        run: >-
          cargo test
          --workspace
          --all-features

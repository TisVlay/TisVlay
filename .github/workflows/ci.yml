name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    # Drafts skip the heavy jobs, so marking a PR ready starts a full run.
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

# Default for every job; a job widens it only where it needs to.
permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress run. Pushes to main
# group by commit, so none is ever cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this change needs. GitHub's `paths` filters only gate whole
  # workflows, so the gate is a job whose outputs the others read.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      book: ${{ steps.classify.outputs.book }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify
        id: classify
        env:
          # A PR checks out its merge commit, whose first parent is main.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          # Fail open: no diff, or an empty one, runs everything.
          if ! files=$(git diff --name-only "$BASE" HEAD) || [ -z "$files" ]; then
            printf 'code=true\nbook=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs-only paths. Crate READMEs are not: they're doctests.
          docs='^(docs/|\.claude/|README\.md$|LICENSE$|\.config/\.readthedocs\.yaml$)'
          # What the book build reads.
          book='^(docs/(book|screenshots|artwork)/|README\.md$|\.config/\.readthedocs\.yaml$)'
          code=false; grep -qvE "$docs" <<< "$files" && code=true
          has_book=false; grep -qE "$book" <<< "$files" && has_book=true
          printf 'code=%s\nbook=%s\n' "$code" "$has_book" >> "$GITHUB_OUTPUT"

  # File checks, typos and the workflow linters on every run, drafts and
  # docs-only PRs included. On code changes the ci job's lint step repeats
  # the file checks and typos with the Rust hooks.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the flake's versions, like the ci job's tools.
      - name: Setup
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: |
            just
            shellcheck@0.11.0
            typos@1.51.1
            zizmor@1.31.0

      # actionlint isn't in install-action's manifest, and it's a Go program,
      # not a crate, so the cargo-binstall fallback can't install it. Fetch
      # the release pinned to the flake's version, and check it against the
      # digest from that release's checksums file.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: File checks
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        env:
          # zizmor's online audits (such as a pinned SHA that doesn't match
          # its version comment) read the GitHub API.
          GH_TOKEN: ${{ github.token }}
        with:
          extra-args: >-
            --all-files
            check-added-large-files check-merge-conflict check-toml
            check-yaml end-of-file-fixer trailing-whitespace typos
            actionlint zizmor

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token the Codecov upload authenticates with.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: |
          rustup component add llvm-tools-preview
          rustup show

      # Tools whose output can differ between releases (formatters, linters,
      # dictionaries) are pinned to the flake's versions so local and CI
      # agree; bump them together after a `nix flake update`.
      - name: Setup
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: |
            cargo-about@0.9.1
            cargo-deny@0.20.2
            cargo-llvm-cov
            cargo-nextest
            cargo-sbom@0.10.0
            cargo-shear@1.14.0
            just
            tombi@1.7.1
            typos@1.51.1

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Save the cache even when subsequent steps fail. Without this,
          # a flaky test or a coverage-ratchet failure wipes the warm
          # target/ tarball and the next run pays the full cold cost.
          cache-on-failure: true

      # The workflow linters are skipped here: the checks job runs them on
      # every change, and this job doesn't install them.
      - name: Lint
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: >-
            --all-files
            --skip build
            --skip clippy
            --skip test
            --skip actionlint
            --skip zizmor

      # Single instrumented build for clippy + tests + doc tests +
      # coverage report — see `just test-ci` and `docs/build.md`
      # "Build pipeline" for the show-env design.
      - name: Test
        run: just test-ci

      # Coverage trends and PR diff annotations on Codecov (free for OSS).
      # It authenticates with GitHub's OIDC token, so no secret is stored.
      # A PR from a fork gets no OIDC token; it uploads without one, which
      # Codecov accepts for forks of public repos.
      - name: Upload to Codecov
        if: ${{ !cancelled() && hashFiles('lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          # An upload error warns but never fails CI: `CI result` is a
          # required check, so a Codecov outage would block every merge.
          # Coverage is gated by the ratchet in `just test-ci`.
          fail_ci_if_error: false

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

      # Whole-workspace SBOM (SPDX) as a build artifact. Generated from
      # Cargo.lock (no build needed); `!cancelled()` mirrors the coverage
      # upload so it is captured even when a later step fails.
      - name: SBOM
        if: ${{ !cancelled() }}
        run: just sbom

      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: target/sbom/
          retention-days: 14

      # The JUnit results for test-report.yml, which turns them into the
      # "Tests" check run: a fork PR's token here is read-only and can't
      # create one. hashFiles guard: if a step before nextest failed there is
      # no JUnit file, and test-report.yml skips a run without the artifact.
      - name: Upload test results
        if: ${{ !cancelled() && hashFiles('target/nextest/ci/junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: target/nextest/ci/junit.xml
          retention-days: 14

  # The workspace must build on its declared `rust-version` floor. The floor
  # is read from Cargo.toml, so this job never needs editing; rustup installs
  # it beside the pinned dev toolchain. No --ignore-rust-version: a
  # dependency that outgrows the floor fails here. Reproduce locally with
  # `just msrv` (Nix-provided toolchain).
  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          # "1.95" means 1.95.0; rustup would otherwise take the latest patch.
          case "$msrv" in *.*.*) ;; *) msrv="$msrv.0" ;; esac
          rustup toolchain install "$msrv" --profile minimal
          # Overrides rust-toolchain.toml for every later step, rust-cache
          # included, so it neither installs the dev pin nor keys on it.
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

  # Every other gate builds with --all-features; this one builds each crate
  # with each feature on its own (and with none), so a crate that no longer
  # compiles with a feature off is caught. Same recipe as locally.
  features:
    needs: changes
    if: needs.changes.outputs.code == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Setup
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: |
            cargo-hack
            just

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: features

      - name: Check each feature
        run: just hack

  # User-facing docs site (docs/book → Read the Docs). Kept off the
  # tuned `ci` job's cache/critical path: it only compiles tisvlay-docgen
  # (the CLI and core it renders, for the generated-partials freshness
  # gate) plus mdbook, Mermaid, and lychee. Runs on code changes too: the
  # partials are rendered from the CLI and core.
  docs:
    needs: changes
    if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.book == 'true') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show

      - name: Setup
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: |
            lychee@0.24.2
            mdbook
            mdbook-mermaid
            just

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      # Regenerate the book's generated partials (CLI reference, profile
      # defaults, release version) and fail if they differ from what's
      # committed — Read the Docs serves the committed copies via a plain
      # `mdbook build`, so a stale partial would silently ship outdated docs.
      - name: Generated partials freshness
        run: just docs-gen-check

      - name: Build book and check links
        run: just docs-links

  # One stable check to require on main: fails if any job failed or was
  # cancelled. Jobs the gate skipped count as passing.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, checks, ci, msrv, features, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

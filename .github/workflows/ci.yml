name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: rustup show

      - name: Setup
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-nextest
            just

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint
        uses: j178/prek-action@v2
        with:
          extra-args: >-
            --all-files
            --skip build
            --skip clippy
            --skip test

      - name: Build
        run: just build

      - name: Clippy
        run: just clippy

      - name: Test
        run: just test-ci

      - name: Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false

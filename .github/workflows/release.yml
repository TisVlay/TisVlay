# Release lifecycle. Two phases, both keyed off the GitHub release you cut:
#
#   1. Push a `vX.Y.Z` tag      -> build the distro packages (.deb/.rpm/.pkg)
#      and attach them to a DRAFT GitHub release, and push the Nix package
#      to tisvlay.cachix.org. Download + test them.
#   2. Promote that release to a full (non-prerelease) release
#      -> publish the crates to crates.io. crates.io is irreversible
#      (yank-only), so it intentionally comes LAST, after you've verified
#      the artifacts.
#
# Version bumps + CHANGELOGs are prepared by the release PR in
# release-plz.yml (merge it before tagging). The publish phase uses
# crates.io trusted publishing, with no stored token: GitHub's OIDC token
# for this workflow, in the `crates-io` environment, is exchanged for a
# short-lived publish token. Trusted publishing can't create a crate, so
# each crate's first publish is by hand, per docs/build.md "First-publish
# checklist".
name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [released]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# No caches in this workflow. Its jobs ship packages and mint crates.io
# tokens, so they must not restore a cache that another workflow's run
# could have written (cache poisoning). They also never hit one: a tag
# run reads only main's caches and its own, and nothing on main writes
# these jobs' keys. Builds start cold, which only release time pays.
jobs:
  # Phase 1 (tag push): build the distro packages + attach to a draft release.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      - name: Setup
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-about
            cargo-nfpm
            cargo-zigbuild
            just

      # `zig` is not in install-action's manifest, so listing it above sends
      # it to the cargo-binstall fallback — which can only resolve crates.io
      # crates and aborts the whole batch on `zig`. Install it from its own
      # release channel instead, pinned to the dev shell's version so CI
      # produces the same glibc-baselined binaries. cargo-zigbuild picks up
      # `zig` from PATH. (cargo-nfpm stays above: it *is* a crate, so its
      # binstall fallback builds it from source fine once zig is out of the
      # batch.)
      - name: Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # No caches in this workflow; see the note above `jobs`.
          use-cache: false

      - name: Package
        run: just package-all

      - name: Checksums
        run: |
          cd target/x86_64-unknown-linux-gnu/dist
          sha256sum tisvlay_*.deb tisvlay-*.rpm tisvlay-*.pkg.tar.zst > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/x86_64-unknown-linux-gnu/dist/tisvlay_*.deb
            target/x86_64-unknown-linux-gnu/dist/tisvlay-*.rpm
            target/x86_64-unknown-linux-gnu/dist/tisvlay-*.pkg.tar.zst
            target/x86_64-unknown-linux-gnu/dist/checksums-sha256.txt

  # Phase 1 (tag push): build the flake's package and push it to the public
  # tisvlay.cachix.org cache (packaging/nix/README.md "Binary cache").
  #
  # The push token lives in the `cachix` environment, which only admits `v*`
  # tags (repo Settings → Environments), so a branch run can't push even if
  # these triggers change. The job only writes to the cache: it builds from
  # cache.nixos.org alone (`skipAddingSubstituter`), keeping this workflow's
  # no-cache rule above.
  nix-cache:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            system: x86_64-linux
          - runner: ubuntu-26.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    environment: cachix
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Nix
        uses: cachix/install-nix-action@v31

      # Installs the cachix CLI only: no substituter, no automatic push.
      - name: Cachix
        uses: cachix/cachix-action@v17
        with:
          name: tisvlay
          skipAddingSubstituter: true
          skipPush: true

      - name: Build
        run: nix build --print-build-logs .#default

      # Push the output's runtime closure, not every path the build made:
      # the vendored crate sources are build-only and mostly missing from
      # cache.nixos.org (docs/ideas/nix-cache-main-builds.md). Then pin it
      # under the tag so cache churn can't evict it. Keeping one revision
      # means a re-pushed tag moves the pin to the new build, and the old
      # one falls to normal eviction.
      - name: Push
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          PIN: ${{ github.ref_name }}-${{ matrix.system }}
        run: |
          out=$(nix build --no-link --print-out-paths .#default)
          cachix push tisvlay "$out"
          cachix pin tisvlay "$PIN" "$out" --keep-revisions 1

  # Phase 2 (release finalized): publish the crates to crates.io. Runs when
  # you promote the verified draft to a full release. release-plz publishes
  # only versions not already on crates.io, in dependency order.
  #
  # Each published crate's trusted publisher on crates.io names this repo,
  # this workflow file and the `crates-io` environment. The environment
  # only admits `v*` tags (repo Settings → Environments), so a run from a
  # branch can't mint a publish token even if this workflow's triggers
  # change. A typo here would make GitHub create a new, unrestricted
  # environment, which crates.io then refuses: the name must match.
  publish-crates:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      # release-plz looks up the pull requests associated with the release
      # commit; without this the GitHub API answers 403.
      pull-requests: read
      # The OIDC token release-plz trades for a crates.io publish token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # `cargo publish` verify-builds each crate; tisvlay-gui links
      # fontconfig (femtovg / winit), as in the build job and ci.yml.
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      - name: Release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: |
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          rustup show

      - name: Setup
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-nfpm
            just

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Package
        run: just package-all

      - name: Checksums
        run: |
          cd target/x86_64-unknown-linux-musl/release
          sha256sum tisvlay_*.deb tisvlay-*.rpm tisvlay-*.pkg.tar.zst > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/x86_64-unknown-linux-musl/release/tisvlay_*.deb
            target/x86_64-unknown-linux-musl/release/tisvlay-*.rpm
            target/x86_64-unknown-linux-musl/release/tisvlay-*.pkg.tar.zst
            target/x86_64-unknown-linux-musl/release/checksums-sha256.txt

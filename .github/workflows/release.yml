# Release lifecycle. Two phases, both keyed off the GitHub release you cut:
#
#   1. Push a `vX.Y.Z` tag      -> build the distro packages (.deb/.rpm/.pkg)
#      and attach them to a DRAFT GitHub release. Download + test them.
#   2. Promote that release to a full (non-prerelease) release
#      -> publish the crates to crates.io. crates.io is irreversible
#      (yank-only), so it intentionally comes LAST, after you've verified
#      the artifacts.
#
# Version bumps + CHANGELOGs are prepared by the release PR in
# release-plz.yml (merge it before tagging). The publish phase is a no-op
# until a `CARGO_REGISTRY_TOKEN` secret (crates.io token, `publish-new` +
# `publish-update` scopes) is set.
name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [released]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Phase 1 (tag push): build the distro packages + attach to a draft release.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      - name: Setup
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-about
            cargo-nfpm
            cargo-zigbuild
            just
            zig

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Package
        run: just package-all

      - name: Checksums
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          sha256sum tisvlay_*.deb tisvlay-*.rpm tisvlay-*.pkg.tar.zst > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/x86_64-unknown-linux-gnu/release/tisvlay_*.deb
            target/x86_64-unknown-linux-gnu/release/tisvlay-*.rpm
            target/x86_64-unknown-linux-gnu/release/tisvlay-*.pkg.tar.zst
            target/x86_64-unknown-linux-gnu/release/checksums-sha256.txt

  # Phase 2 (release finalized): publish the crates to crates.io. Runs when
  # you promote the verified draft to a full release. release-plz publishes
  # only versions not already on crates.io, in dependency order; it's a
  # no-op without CARGO_REGISTRY_TOKEN.
  publish-crates:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # `cargo publish` verify-builds each crate; tisvlay-gui links
      # fontconfig (femtovg / winit), as in the build job and ci.yml.
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

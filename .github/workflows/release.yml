# Release lifecycle. Two phases, both keyed off the GitHub release you cut:
#
#   1. Push a `vX.Y.Z` tag      -> build the distro packages (.deb/.rpm/.pkg)
#      and per-binary SBOMs for x86_64 and arm64, sign them
#      (build-packages.yml), verify every signature, attach it all to a
#      DRAFT GitHub release, and push the Nix package to
#      tisvlay.cachix.org (after your approval). Run
#      `just verify-release vX.Y.Z` on the draft and test the packages.
#   2. Promote that release to a full (non-prerelease) release
#      -> publish the crates to crates.io (after your approval).
#      crates.io is irreversible (yank-only), so it intentionally comes
#      LAST, after you've verified the artifacts. With immutable releases
#      on, promoting also locks the tag and the assets.
#
# Version bumps + CHANGELOGs come from `release-plz update`, run locally and
# merged as a PR before tagging; the release-PR workflow (release-plz.yml)
# stays off, since its PRs wouldn't trigger CI. The publish phase uses
# crates.io trusted publishing, with no stored token: GitHub's OIDC token
# for this workflow, in the `crates-io` environment, is exchanged for a
# short-lived publish token. Trusted publishing can't create a crate, so
# each crate's first publish is by hand, per docs/build.md "First-publish
# checklist".
name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [released]

env:
  CARGO_TERM_COLOR: always

# Nothing by default: each job grants itself what it needs.
permissions: {}

# No caches in this workflow. Its jobs ship packages and mint crates.io
# tokens, so they must not restore a cache that another workflow's run
# could have written (cache poisoning). They also never hit one: a tag
# run reads only main's caches and its own, and nothing on main writes
# these jobs' keys. Builds start cold, which only release time pays.
jobs:
  # Phase 1 (tag push): build, SBOM and sign the distro packages for both
  # architectures, in the reusable workflow whose signatures name it as the
  # signer (SLSA Build Level 3; see the note at its top). A caller grants a
  # reusable workflow's jobs at most its own permissions, and each of those
  # jobs takes only what it needs: the build jobs get no signing token.
  build:
    if: github.event_name == 'push'
    # zizmor asks for GitHub's newer `$/` self-repository syntax, but
    # actionlint 1.7.12 rejects it, and for a reusable workflow `./` already
    # resolves at this run's own commit. Switch once actionlint accepts `$/`.
    uses: ./.github/workflows/build-packages.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Phase 1, continued: check every signature the way a user would, before
  # any draft exists. `just verify-assets` is the same check the maintainer
  # runs on the draft (`just verify-release`), so the two can't drift. It
  # unpacks each package and verifies the binaries inside too, which is what
  # an installed system has, and verifies again from the bundles alone.
  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gh reads the attestations back.
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bsdtar unpacks all three package formats.
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Setup
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: out

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          merge-multiple: true
          path: out/assets

      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: just verify-assets out/assets "$GITHUB_REF"

  # Phase 1, continued: one draft release with both architectures' packages,
  # SBOMs and signature bundles, and a single checksum file. One job creates
  # it, so the build legs can't race to.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: out

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          merge-multiple: true
          path: out/assets

      - name: Checksums
        run: |
          cd out/assets
          sha256sum tisvlay_*.deb tisvlay-*.rpm tisvlay-*.pkg.tar.zst tisvlay*.cdx.json tisvlay*.sigstore.json > checksums-sha256.txt
          cat checksums-sha256.txt

      # One draft per tag. A rerun (of this job or of the tag push) refreshes
      # that draft: it replaces the assets and deletes any the new build
      # didn't produce, such as packages named for a version the tag no
      # longer points at. CI never publishes; promoting the draft is the
      # maintainer's step, and a published release fails here rather than
      # have its assets replaced.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s failglob
          cd out/assets
          files=(tisvlay_*.deb tisvlay-*.rpm tisvlay-*.pkg.tar.zst tisvlay*.cdx.json tisvlay*.sigstore.json checksums-sha256.txt)
          # Start the generated notes at the latest published release, by
          # name: GitHub's own choice of starting point isn't reliable.
          notes=(--generate-notes)
          start=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$start" ]; then notes+=(--notes-start-tag "$start"); fi
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$TAG" --draft --verify-tag "${notes[@]}" --title "$TAG" "${files[@]}"
          elif [ "$draft" = true ]; then
            gh release upload "$TAG" --clobber "${files[@]}"
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              [[ " ${files[*]} " == *" $asset "* ]] || gh release delete-asset "$TAG" "$asset" --yes
            done
          else
            echo "::error::$TAG is already published; tag a new version instead."
            exit 1
          fi

  # Phase 1 (tag push): build the flake's package and push it to the public
  # tisvlay.cachix.org cache (packaging/nix/README.md "Binary cache").
  #
  # The push token lives in the `cachix` environment, which only admits `v*`
  # tags and needs the maintainer's approval (repo Settings → Environments),
  # so a branch run can't push, and a tag run waits for that click, even if
  # these triggers change. The job only writes to the cache: it builds from
  # cache.nixos.org alone (`skipAddingSubstituter`), keeping this workflow's
  # no-cache rule above.
  nix-cache:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            system: x86_64-linux
          - runner: ubuntu-26.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    environment: cachix
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3

      # Installs the cachix CLI only: no substituter, no automatic push.
      - name: Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: tisvlay
          skipAddingSubstituter: true
          skipPush: true

      - name: Build
        run: nix build --print-build-logs .#default

      # Push the output's runtime closure, not every path the build made:
      # the vendored crate sources are build-only and mostly missing from
      # cache.nixos.org (docs/ideas/nix-cache-main-builds.md). Then pin it
      # under the tag so cache churn can't evict it. Keeping one revision
      # means a tag moved before its release is published (only admins can
      # move `v*` tags, and a published release's tag can't move) moves the
      # pin to the new build, and the old one falls to normal eviction.
      - name: Push
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          PIN: ${{ github.ref_name }}-${{ matrix.system }}
        run: |
          out=$(nix build --no-link --print-out-paths .#default)
          cachix push tisvlay "$out"
          cachix pin tisvlay "$PIN" "$out" --keep-revisions 1

  # Phase 2 (release finalized): publish the crates to crates.io. Runs when
  # you promote the verified draft to a full release. release-plz publishes
  # only versions not already on crates.io, in dependency order.
  #
  # Each published crate's trusted publisher on crates.io names this repo,
  # this workflow file and the `crates-io` environment. The environment
  # only admits `v*` tags and needs the maintainer's approval (repo
  # Settings → Environments), so a run from a branch can't mint a publish
  # token even if this workflow's triggers change, and a tag run waits for
  # that approval. A typo here would make GitHub create a new, unrestricted
  # environment, which crates.io then refuses: the name must match.
  publish-crates:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      # release-plz looks up the pull requests associated with the release
      # commit; without this the GitHub API answers 403.
      pull-requests: read
      # The OIDC token release-plz trades for a crates.io publish token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `cargo publish` verify-builds each crate; tisvlay-gui links
      # fontconfig (femtovg / winit), as in the build job and ci.yml.
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      - name: Release-plz release
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

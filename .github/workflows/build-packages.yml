# The release build and its signatures: distro packages and per-binary SBOMs
# for x86_64 and arm64, signed through Sigstore. release.yml calls it on a
# `v*` tag push. It's a reusable workflow so that its signatures name it, not
# the caller, as the signer (SLSA Build Level 3). Verifiers pin it with
#   --signer-workflow TisVlay/TisVlay/.github/workflows/build-packages.yml
# as `just verify-assets` and the book's "Verify your download" section do;
# keep the three in step if this file ever moves.
#
# Building and signing are separate jobs. Every process in a job with
# `id-token: write` can request that job's signing token, so the build jobs,
# which run every dependency's build scripts and proc macros, get none. Only
# the attest jobs, which download the build output and run actions/attest,
# hold one.
#
# No caches, as in release.yml: these jobs ship packages and hold signing
# tokens, so they must not restore a cache another workflow could have
# written.
name: Build packages

on:
  workflow_call:

permissions: {}

jobs:
  # One leg per architecture, each natively on its own runner (`just
  # package-*` targets the host's architecture). Zig still pins the glibc
  # baseline; building natively avoids cross sysroots for the GUI's
  # fontconfig link.
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      # Pinned to the flake's versions, so the release build matches the dev
      # shell's; bump them together after a `nix flake update`. cargo-about
      # is the same 0.9.1 as packaging/nix/cargo-about.nix and ci.yml.
      - name: Setup
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: |
            cargo-about@0.9.1
            cargo-auditable@0.7.6
            cargo-cyclonedx@0.5.9
            cargo-nfpm@0.1.3
            cargo-zigbuild@0.23.4
            just
            rust-audit-info@0.5.4

      # `zig` is not in install-action's manifest, so listing it above sends
      # it to the cargo-binstall fallback — which can only resolve crates.io
      # crates and aborts the whole batch on `zig`. Install it from its own
      # release channel instead, pinned to the dev shell's version so CI
      # produces the same glibc-baselined binaries. cargo-zigbuild picks up
      # `zig` from PATH. (cargo-nfpm stays above: it *is* a crate, so its
      # binstall fallback builds it from source fine once zig is out of the
      # batch.)
      - name: Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          # No caches in this workflow; see the note at the top.
          use-cache: false

      - name: Package
        run: just package-all

      # One SBOM per shipped binary; the job fails if one lists different
      # crates than the binary embeds.
      - name: SBOMs
        run: just sbom-check

      # Everything the attest and release jobs need, in one flat artifact
      # (upload-artifact roots a multi-path upload at the paths' common
      # ancestor, so files from two directories would land in subfolders):
      #   assets/  the packages and SBOMs, which become release assets;
      #   attest/  what the attest job signs, as checksum files it reads
      #            without needing the binaries themselves: the packages and
      #            binaries for provenance, and each binary plus the packages
      #            that ship it for that binary's SBOM. Binaries are named
      #            <arch>/<binary>, since both architectures' share a name.
      - name: Stage
        run: |
          arch=$(uname -m)
          out=target/release-out
          rm -rf "$out" && mkdir -p "$out/assets" "$out/attest"
          cp target/nfpm-dist/tisvlay_*.deb target/nfpm-dist/tisvlay-*.rpm \
            target/nfpm-dist/tisvlay-*.pkg.tar.zst target/sbom/*.cdx.json "$out/assets/"
          (cd "$out/assets" && sha256sum tisvlay_*.deb tisvlay-*.rpm tisvlay-*.pkg.tar.zst) > "$out/attest/packages.sha256"
          for bin in tisvlay tisvlay-gui; do
            echo "$(sha256sum < "target/nfpm-dist/$bin" | cut -d' ' -f1)  $arch/$bin" > "$out/attest/$bin.sha256"
            cat "$out/attest/$bin.sha256" "$out/attest/packages.sha256" > "$out/attest/$bin-sbom-subjects.sha256"
            cp target/sbom/"$bin"-*-"$arch".cdx.json "$out/attest/$bin.cdx.json"
          done
          cat "$out/attest/packages.sha256" "$out/attest/tisvlay.sha256" "$out/attest/tisvlay-gui.sha256" \
            > "$out/attest/provenance-subjects.sha256"
          echo "$arch" > "$out/attest/arch"
          find "$out" -type f | sort

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ runner.arch }}
          if-no-files-found: error
          path: target/release-out/

  # Signing, one leg per architecture: one provenance attestation over that
  # architecture's three packages and two binaries, and one SBOM attestation
  # per binary, over the binary and the packages that ship it. Each
  # attestation's Sigstore bundle is uploaded too, for the release to carry,
  # named after what it signs.
  attest:
    needs: build
    strategy:
      matrix:
        artifact: [build-X64, build-ARM64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token the attestations are signed with.
      id-token: write
      # Store the attestations with the repository.
      attestations: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: in

      - name: Provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: in/attest/provenance-subjects.sha256

      - name: SBOM (tisvlay)
        id: sbom-tisvlay
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: in/attest/tisvlay-sbom-subjects.sha256
          sbom-path: in/attest/tisvlay.cdx.json

      - name: SBOM (tisvlay-gui)
        id: sbom-tisvlay-gui
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: in/attest/tisvlay-gui-sbom-subjects.sha256
          sbom-path: in/attest/tisvlay-gui.cdx.json

      # <binary>-<version>-<arch>.cdx.sigstore.json signs that SBOM asset;
      # tisvlay-<version>-<arch>.provenance.sigstore.json signs the build.
      - name: Bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_TISVLAY: ${{ steps.sbom-tisvlay.outputs.bundle-path }}
          SBOM_TISVLAY_GUI: ${{ steps.sbom-tisvlay-gui.outputs.bundle-path }}
        run: |
          arch=$(cat in/attest/arch)
          version=$(jq -r .metadata.component.version in/attest/tisvlay.cdx.json)
          mkdir -p bundles
          cp "$PROVENANCE" "bundles/tisvlay-$version-$arch.provenance.sigstore.json"
          cp "$SBOM_TISVLAY" "bundles/tisvlay-$version-$arch.cdx.sigstore.json"
          cp "$SBOM_TISVLAY_GUI" "bundles/tisvlay-gui-$version-$arch.cdx.sigstore.json"
          ls bundles

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.artifact }}
          if-no-files-found: error
          path: bundles/

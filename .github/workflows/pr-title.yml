# Lint the pull-request title against Conventional Commits. Small PRs are
# squash-merged, so the PR title is the subject that lands on the default
# branch and feeds release-plz's version + CHANGELOG derivation — this is the
# authoritative commit-subject gate for them. Plan-driven PRs keep merge
# commits, whose individual subjects feed release-plz instead. (Local commits
# get an advisory check from the prek commit-msg hook.) A dedicated workflow
# with an `edited` trigger so a title fix re-runs just this lint, not the full
# CI build.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

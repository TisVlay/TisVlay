# Automated crates.io publishing via release-plz (config: release-plz.toml).
#
# Flow: a push to `main` opens/updates a "release" PR (version bump +
# CHANGELOGs); merging it makes the next run publish the publishable crates
# to crates.io in dependency order. Distro packages + the GitHub release
# stay on release.yml (manual `v*` tag).
#
# Prerequisites (inert until set):
#   - A `CARGO_REGISTRY_TOKEN` repo secret: a crates.io API token scoped
#     `publish-new` + `publish-update`.
#   - Repo setting "Allow GitHub Actions to create and approve pull
#     requests" enabled, so the release-pr job can open its PR.
name: Release-plz

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

# One release run at a time; never cancel an in-flight publish.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish unpublished crates to crates.io (dependency order).
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # `cargo publish` verify-builds each crate; tisvlay-gui links
      # fontconfig (femtovg / winit), as in ci.yml and release.yml.
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open / update the release PR (version bumps + CHANGELOGs).
  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Release-plz PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

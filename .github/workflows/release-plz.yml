# Version-bump + CHANGELOG automation via release-plz (config: .config/release-plz.toml).
#
# On every push to `main`, release-plz opens/updates a single "release" PR
# that bumps the shared workspace version (from the conventional-commit
# history) and regenerates the per-crate CHANGELOGs. Merging that PR lands
# the bump on `main` — that's how you cut a release. Then tag `vX.Y.Z` to
# build + verify the distro packages, and promote the GitHub release to
# publish the crates to crates.io (both in release.yml).
#
# Prerequisite: the repo setting "Allow GitHub Actions to create and
# approve pull requests" must be enabled so this job can open its PR.
# (The crates.io publish itself lives in release.yml, gated on you
# finalizing the release.)
name: Release PR

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

# One open release PR at a time; never cancel an in-flight update.
concurrency:
  group: release-plz-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev

      - name: Toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Release-plz PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

version: 2
updates:
  # GitHub Actions: bump weekly, grouped into a single PR so action bumps
  # don't arrive one-PR-per-action. `prefix: "ci"` + `include: "scope"` yields
  # Conventional-Commits titles ("ci(deps): ...") that pass the PR-title lint.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
  # Cargo: bump weekly, grouped into a single PR. Titles are "chore(deps): ...".
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo:
        patterns:
          - "*"

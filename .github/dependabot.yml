version: 2
updates:
  # GitHub Actions: bump weekly, grouped into a single PR so action bumps
  # don't arrive one-PR-per-action. `prefix: "ci"` + `include: "scope"` yields
  # Conventional-Commits titles ("ci(deps): ...") that pass the PR-title lint.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised
    # release is more likely to be caught and pulled first. Security
    # updates aren't delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
  # Cargo: bump weekly, grouped into a single PR. Titles are "chore(deps): ...".
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same one-week wait as above.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo:
        patterns:
          - "*"

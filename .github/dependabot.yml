version: 2
updates:
  # GitHub Actions: bump weekly, grouped into a single PR so action bumps
  # don't arrive one-PR-per-action. `prefix: "ci"` + `include: "scope"` yields
  # Conventional-Commits titles ("ci(deps): ...") that pass the PR-title lint.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised
    # release is more likely to be caught and pulled first. Security
    # updates aren't delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
  # Cargo: bump weekly, grouped into a single PR. Titles are "chore(deps): ...".
  # Semver-major bumps match no group, so Dependabot opens one PR per crate
  # for them: a major often has to wait for the crates that share its types
  # to move too, and one waiting in the group would block the rest of the
  # week's bumps. Dependabot calls a 0.x bump like 0.11 → 0.12 a minor one,
  # though Cargo treats it as breaking, so 0.x crates that have hit that
  # wait are excluded from the group by name and get their own PRs too.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same one-week wait as above.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo:
        patterns:
          - "*"
        exclude-patterns:
          # Shared with Slint, which is pinned exactly.
          - "fontique"
          # Shared with arboard and pipewire-native.
          - "parking_lot"
        update-types:
          - "minor"
          - "patch"

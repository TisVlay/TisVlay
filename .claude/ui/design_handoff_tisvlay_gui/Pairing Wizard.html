<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>tisvlay — Pairing Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #e8ebf0; font-family: "Inter", system-ui, sans-serif; }
  body { color: #1a1d22; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  @keyframes tv-pulse {
    0%   { transform: scale(0.6); opacity: 0.7; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @keyframes tv-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes tv-scan {
    0%   { left: -40%; }
    100% { left: 100%; }
  }
  @keyframes fadein-row {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 0.55; transform: translateY(2px); }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wizard-components.jsx"></script>
<script type="text/babel" src="wizard-frames.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#3daee9",
  "showAnnotations": true
}/*EDITMODE-END*/;

// KDE Breeze accent presets
const ACCENT_PRESETS = [
  { value: "#3daee9", label: "Breeze Blue" },
  { value: "#3b82f6", label: "Cobalt" },
  { value: "#26a69a", label: "Teal" },
  { value: "#7c3aed", label: "Plum" },
  { value: "#f97316", label: "Orange" },
  { value: "#16a34a", label: "Green" },
];

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const accent = tweaks.accent || "#3daee9";
  const showAnnotations = tweaks.showAnnotations !== false;

  // Apply accent as CSS variable globally
  React.useEffect(() => {
    document.documentElement.style.setProperty("--accent", accent);
  }, [accent]);

  return (
    <>
      <DesignCanvas title="tisvlay — Pairing wizard" subtitle="Modal dialog, ~600×520, KDE-Breeze-friendly. Light + dark frames, all 4 wizard steps and 4 pairing sub-states.">
        <DCSection id="overview" title="Wizard flow — light theme">
          <DCArtboard id="d-discover-streaming" label="① Discover — streaming results" width={600} height={520}>
            <FrameDiscoverStreaming theme="light" />
          </DCArtboard>
          <DCArtboard id="d-configure" label="② Configure" width={600} height={520}>
            <FrameConfigure theme="light" />
          </DCArtboard>
          <DCArtboard id="d-pair-complete" label="③ Pair — complete" width={600} height={520}>
            <FramePairComplete theme="light" />
          </DCArtboard>
          <DCArtboard id="d-done" label="④ Done" width={600} height={520}>
            <FrameDone theme="light" />
          </DCArtboard>
        </DCSection>

        <DCSection id="step1-states" title="Step 1 — Discover · empty / streaming / error">
          <DCArtboard id="s1-empty" label="Empty — searching" width={600} height={520}>
            <FrameDiscoverEmpty theme="light" />
          </DCArtboard>
          <DCArtboard id="s1-streaming" label="Streaming — 2 found, 1 fading in" width={600} height={520}>
            <FrameDiscoverStreaming theme="light" />
          </DCArtboard>
          <DCArtboard id="s1-error" label="Error — SSDP blocked, manual fallback" width={600} height={520}>
            <FrameDiscoverError theme="light" />
          </DCArtboard>
        </DCSection>

        <DCSection id="step3-substates" title="Step 3 — Pair · all four phase states">
          <DCArtboard id="p-prompting" label="prompting" width={600} height={520}>
            <FramePairPrompting theme="light" />
          </DCArtboard>
          <DCArtboard id="p-registering" label="registering" width={600} height={520}>
            <FramePairRegistering theme="light" />
          </DCArtboard>
          <DCArtboard id="p-complete" label="complete" width={600} height={520}>
            <FramePairComplete theme="light" />
          </DCArtboard>
          <DCArtboard id="p-failed" label="failed" width={600} height={520}>
            <FramePairFailed theme="light" />
          </DCArtboard>
        </DCSection>

        <DCSection id="dark-theme" title="Dark theme — full flow">
          <DCArtboard id="dk-empty" label="① Discover — empty" width={600} height={520}>
            <FrameDiscoverEmpty theme="dark" />
          </DCArtboard>
          <DCArtboard id="dk-streaming" label="① Discover — streaming" width={600} height={520}>
            <FrameDiscoverStreaming theme="dark" />
          </DCArtboard>
          <DCArtboard id="dk-error" label="① Discover — error" width={600} height={520}>
            <FrameDiscoverError theme="dark" />
          </DCArtboard>
          <DCArtboard id="dk-configure" label="② Configure" width={600} height={520}>
            <FrameConfigure theme="dark" />
          </DCArtboard>
          <DCArtboard id="dk-prompting" label="③ Pair — prompting" width={600} height={520}>
            <FramePairPrompting theme="dark" />
          </DCArtboard>
          <DCArtboard id="dk-registering" label="③ Pair — registering" width={600} height={520}>
            <FramePairRegistering theme="dark" />
          </DCArtboard>
          <DCArtboard id="dk-complete" label="③ Pair — complete" width={600} height={520}>
            <FramePairComplete theme="dark" />
          </DCArtboard>
          <DCArtboard id="dk-failed" label="③ Pair — failed" width={600} height={520}>
            <FramePairFailed theme="dark" />
          </DCArtboard>
          <DCArtboard id="dk-done" label="④ Done" width={600} height={520}>
            <FrameDone theme="dark" />
          </DCArtboard>
        </DCSection>

        <DCSection id="a11y" title="Accessibility pass — contrast + focus order">
          <DCArtboard id="a11y-notes" label="A11y notes — apply during Slint port" width={600} height={520}>
            <A11yNotes />
          </DCArtboard>
          <DCArtboard id="a11y-focus" label="Tab order overlay (Configure)" width={600} height={520}>
            <FocusOrderOverlay />
          </DCArtboard>
          <DCArtboard id="a11y-error" label="Error legibility — pair failed, dark" width={600} height={520}>
            <FramePairFailed theme="dark" />
          </DCArtboard>
        </DCSection>

        <DCSection id="primitives" title="Reusable primitives — for handoff to Slint">
          <DCArtboard id="prim-stepper" label="ProgressStepper" width={600} height={140}>
            <PrimitiveStepperShowcase />
          </DCArtboard>
          <DCArtboard id="prim-row" label="DiscoveryRow (icon + 2-line text)" width={600} height={220}>
            <PrimitiveRowShowcase />
          </DCArtboard>
          <DCArtboard id="prim-status" label="StatusCard (4 phases)" width={600} height={420}>
            <PrimitiveStatusShowcase />
          </DCArtboard>
          <DCArtboard id="prim-form" label="FormRow (label + control + helper)" width={600} height={300}>
            <PrimitiveFormShowcase />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Accent">
          <TweakSelect
            label="KDE Breeze accent"
            value={accent}
            options={ACCENT_PRESETS}
            onChange={(v) => setTweak("accent", v)}
          />
          <TweakColor label="Custom" value={accent} onChange={(v) => setTweak("accent", v)} />
        </TweakSection>
        <TweakSection title="Display">
          <TweakToggle label="Show annotations" value={showAnnotations} onChange={(v) => setTweak("showAnnotations", v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

// ===== Primitive showcase artboards =====================================
function PrimitiveStepperShowcase() {
  return (
    <div style={{ background: "#fff", borderRadius: 6, border: "1px solid #dcdfe4", padding: 0, overflow: "hidden" }}>
      <Stepper theme="light" current={1} />
      <Stepper theme="light" current={2} />
      <Stepper theme="light" current={3} />
      <Stepper theme="light" current={4} />
    </div>
  );
}

function PrimitiveRowShowcase() {
  const tvs = [
    { vendor: "lg",      name: "Living Room G4", model: "OLED65G4",   ip: "192.168.1.100", timestamp: "discovered just now" },
    { vendor: "samsung", name: "Office QN90C",   model: "QN65QN90C",  ip: "192.168.1.142", timestamp: "1 second ago" },
    { vendor: "sony",    name: "Guest Bravia",   model: "XR-65A95L",  ip: "192.168.1.187", timestamp: "fading in…" },
  ];
  return (
    <div style={{ background: "#fff", borderRadius: 6, border: "1px solid #dcdfe4", padding: 6 }}>
      <DiscoveryRow theme="light" tv={tvs[0]} selected onClick={() => {}} />
      <DiscoveryRow theme="light" tv={tvs[1]} onClick={() => {}} />
      <DiscoveryRow theme="light" tv={tvs[2]} fadingIn onClick={() => {}} />
    </div>
  );
}

function PrimitiveStatusShowcase() {
  return (
    <div style={{
      display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, padding: 4,
    }}>
      {[
        { label: "prompting",   render: <FramePairPrompting theme="light" /> },
        { label: "registering", render: <FramePairRegistering theme="light" /> },
        { label: "complete",    render: <FramePairComplete theme="light" /> },
        { label: "failed",      render: <FramePairFailed theme="light" /> },
      ].map((s) => (
        <div key={s.label} style={{ transform: "scale(0.46)", transformOrigin: "top left", width: 600, height: 520 }}>
          {s.render}
        </div>
      ))}
    </div>
  );
}

function PrimitiveFormShowcase() {
  return (
    <div style={{ background: "#fff", borderRadius: 6, border: "1px solid #dcdfe4", padding: 18, display: "flex", flexDirection: "column", gap: 14 }}>
      <FormRow theme="light" label="Friendly name" helper="Shown in the TVs pane and tray menu.">
        <TextInput theme="light" value="Living Room G4" />
      </FormRow>
      <FormRow theme="light" label="Initial system profile" helper="Drives boot/shutdown/sleep behavior.">
        <Select theme="light" value="default" options={[
          { value: "default", label: "default" },
          { value: "movie-night", label: "movie-night" },
          { value: "gaming", label: "gaming" },
        ]} />
      </FormRow>
      <FormRow theme="light" label="IP address" error="Couldn't reach 192.168.1.100 (timeout after 4s).">
        <TextInput theme="light" value="192.168.1.100" monospace />
      </FormRow>
    </div>
  );
}

// ===== A11y notes ========================================================
function A11yNotes() {
  return (
    <div style={{
      background: "#fff", borderRadius: 6, border: "1px solid #dcdfe4",
      padding: 24, height: "100%", overflow: "auto",
      fontSize: 13, lineHeight: 1.55, color: "#1a1d22",
    }}>
      <h2 style={{ margin: 0, fontSize: 16, fontWeight: 700 }}>Accessibility notes</h2>
      <p style={{ color: "#5b626d", margin: "4px 0 16px" }}>For the Slint port — verified against Plasma Breeze tokens and WCAG&nbsp;AA.</p>

      <h3 style={{ fontSize: 13, margin: "0 0 6px" }}>Contrast</h3>
      <ul style={{ margin: "0 0 14px 20px", padding: 0, color: "#374151" }}>
        <li>Body text <code>#1a1d22</code> on <code>#ffffff</code> — 16.4:1 ✓</li>
        <li>Dimmed text <code>#5b626d</code> on <code>#ffffff</code> — 6.1:1 ✓</li>
        <li>Faint timestamp <code>#8a909a</code> — 3.8:1, used only for non-essential timestamps (≥12px, never standalone information).</li>
        <li>Accent button <code>#3daee9</code> on white — 2.7:1, so always paired with white text and ≥600 weight; never used as plain link text on white.</li>
        <li>Error red <code>#dc2626</code> on white — 4.7:1 ✓; on dark surface <code>#232730</code> uses <code>#f87171</code> — 4.9:1 ✓.</li>
      </ul>

      <h3 style={{ fontSize: 13, margin: "0 0 6px" }}>Focus order</h3>
      <ol style={{ margin: "0 0 14px 20px", padding: 0, color: "#374151" }}>
        <li>Skip the stepper (decorative; <code>accessible-role: none</code>).</li>
        <li>Primary content area first (list, form fields, status card).</li>
        <li>Footer: <b>Cancel → Back → Next/Close</b> — Next is the default activation (<code>Return</code>).</li>
        <li><code>Esc</code> triggers Cancel except during <i>registering</i> (cancel still allowed but confirms).</li>
      </ol>

      <h3 style={{ fontSize: 13, margin: "0 0 6px" }}>Live regions</h3>
      <ul style={{ margin: "0 0 14px 20px", padding: 0, color: "#374151" }}>
        <li>Discovery list: <code>accessible-role: list</code>, items announce "<i>Living Room G4, LG, 192.168.1.100, discovered just now</i>".</li>
        <li>Pair status card: <code>accessible-role: status</code> + <code>accessible-live: polite</code> so phase changes are announced.</li>
        <li>Error banner: <code>accessible-role: alert</code> (assertive).</li>
      </ul>

      <h3 style={{ fontSize: 13, margin: "0 0 6px" }}>Hit targets &amp; legibility</h3>
      <ul style={{ margin: 0, padding: "0 0 0 20px", color: "#374151" }}>
        <li>All buttons ≥30 px tall, list rows ≥48 px (Fitts-friendly across DEs).</li>
        <li>Error message slot stays ≥12 px and never collapses width-wise — wraps with <code>wrap: word-wrap</code>.</li>
        <li>Reduced-motion: scan line + pulse fall back to static color when <code>prefers-reduced-motion</code> is set.</li>
      </ul>
    </div>
  );
}

function FocusOrderOverlay() {
  return (
    <div style={{ position: "relative", width: 600, height: 520 }}>
      <FrameConfigure theme="light" />
      {/* Numbered focus markers */}
      {[
        { n: 1, x: 460, y: 50, label: "Cancel ⎋" },
        { n: 2, x: 30,  y: 168, label: "Friendly name" },
        { n: 3, x: 30,  y: 288, label: "Initial profile" },
        { n: 4, x: 30,  y: 388, label: "Managed checkbox" },
        { n: 5, x: 380, y: 478, label: "Back" },
        { n: 6, x: 470, y: 478, label: "Next ⏎" },
      ].map((m) => (
        <div key={m.n} style={{
          position: "absolute", left: m.x, top: m.y,
          background: "#fef3c7", border: "1.5px solid #f59e0b", color: "#92400e",
          fontSize: 11, fontWeight: 700,
          width: 22, height: 22, borderRadius: 11,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 2px 6px rgba(0,0,0,.15)",
          fontFamily: "Inter, sans-serif",
        }}>{m.n}</div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

# Sample boot config for tisvlay-daemon (--boot). Additive: entries
# seed TVs at start, but ids already present in the daemon's writable
# state file win, and pairing/state changes persist to the state file
# regardless. Managed TVs live in the daemon-owned file (daemon.toml), written
# by the daemon itself — this file is only for declarative seeding.

[[tv]]
name = "Den"
vendor = "mock"
config = { address = "mock://den" }

[[tv]]
name = "Living Room"
vendor = "lg"
config = { ip = "192.168.1.170", mac = "84:90:0a:63:a9:94" }

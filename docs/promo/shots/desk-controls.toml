# Shot 1.2: everyday control from the desk. The settings window shows
# both TVs; the picture and audio rows follow as the backlight, volume
# and mute change from the CLI, as the tray's scroll would change them.

[[tv]]
name = "Desk"
vendor = "lg"
address = "192.0.2.10"

[[tv]]
name = "Living Room"
vendor = "cec"
address = "192.0.2.20"

[gui]

[[step]]
do = "pause"
ms = 900

[[step]]
do = "click"
label = "Desk"

[[step]]
do = "pause"
ms = 500

# Down to the picture and audio rows.
[[step]]
do = "scroll"
x = 450.0
y = 300.0
dy = -470.0
ms = 900

[[step]]
do = "pause"
ms = 300

[[step]]
do = "ramp"
args = ["volume", "{Desk}"]
slider = "Volume"
from = 30
to = 60
ms = 900

[[step]]
do = "pause"
ms = 300

[[step]]
do = "ramp"
args = ["volume", "{Desk}"]
slider = "Volume"
from = 60
to = 18
ms = 1100

[[step]]
do = "pause"
ms = 400

[[step]]
do = "ramp"
args = ["backlight", "{Desk}"]
slider = "Backlight"
from = 80
to = 35
ms = 1100

[[step]]
do = "pause"
ms = 400

[[step]]
do = "cli"
args = ["mute", "{Desk}", "on"]

[[step]]
do = "pause"
ms = 1500

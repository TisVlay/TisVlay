# Shot 1.2: everyday control from the desk. The settings window shows
# both TVs; the picture and audio rows follow as the backlight, volume
# and mute change from the CLI, as the tray's scroll would change them.

[[tv]]
name = "Desk"
vendor = "lg"
address = "192.0.2.10"

[[tv]]
name = "Living Room"
vendor = "cec"
address = "192.0.2.20"

[gui]

[[step]]
do = "pause"
ms = 1200

[[step]]
do = "click"
label = "Desk"

[[step]]
do = "pause"
ms = 1000

# Down to the picture and audio rows.
[[step]]
do = "scroll"
x = 450.0
y = 300.0
dy = -470.0

[[step]]
do = "pause"
ms = 1200

[[step]]
do = "cli"
args = ["volume", "{Desk}", "55"]

[[step]]
do = "pause"
ms = 1000

[[step]]
do = "cli"
args = ["volume", "{Desk}", "20"]

[[step]]
do = "pause"
ms = 1200

[[step]]
do = "cli"
args = ["backlight", "{Desk}", "35"]

[[step]]
do = "pause"
ms = 1200

[[step]]
do = "cli"
args = ["mute", "{Desk}", "on"]

[[step]]
do = "pause"
ms = 2000

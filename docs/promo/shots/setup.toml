# Shots 3.2 and 3.3: the pairing wizard discovers a TV, and pairs it
# once the prompt on the TV is approved.

[[found]]
name = "Living Room TV"
address = "192.0.2.30"

[[found]]
name = "Bedroom TV"
address = "192.0.2.31"

[gui]

[[step]]
do = "pause"
ms = 800

[[step]]
do = "click"
id = "TvList::pair"

# The scan and its animation, before a TV is picked.
[[step]]
do = "pause"
ms = 2600

[[step]]
do = "click"
label = "Living Room TV"

[[step]]
do = "pause"
ms = 900

[[step]]
do = "click"
label = "Next"

[[step]]
do = "pause"
ms = 700

[[step]]
do = "click"
label = "Pair"

# The wizard waits on the TV's prompt until someone approves it there.
[[step]]
do = "pause"
ms = 2200

[[step]]
do = "approve"

[[step]]
do = "pause"
ms = 1600

[[step]]
do = "click"
label = "Next"

[[step]]
do = "pause"
ms = 2500

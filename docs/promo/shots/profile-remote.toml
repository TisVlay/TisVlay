# Shot 1.8, first half: the system profile is told what the power key on
# the TV's remote does to this PC.

[[tv]]
name = "Desk"
vendor = "lg"
address = "192.0.2.10"

[[tv]]
name = "Living Room"
vendor = "cec"
address = "192.0.2.20"

[gui]

[[step]]
do = "pause"
ms = 800

[[step]]
do = "click"
id = "AppWindow::profiles-item"

[[step]]
do = "pause"
ms = 900

[[step]]
do = "click"
label = "default"

[[step]]
do = "pause"
ms = 900

[[step]]
do = "scroll"
x = 450.0
y = 300.0
dy = -480.0
ms = 1100

[[step]]
do = "pause"
ms = 500

[[step]]
do = "click"
label = "On remote power key"

[[step]]
do = "pause"
ms = 800

[[step]]
do = "click"
label = "suspend"

[[step]]
do = "pause"
ms = 1800

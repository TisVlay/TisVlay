# Shot 1.7: couch mode, the settings window at its 10-foot scale, driven
# by the keys a TV remote or a gamepad sends.

[[tv]]
name = "Desk"
vendor = "lg"
address = "192.0.2.10"

[[tv]]
name = "Living Room"
vendor = "cec"
address = "192.0.2.20"

# A 4K TV at a 200% display scale, not a desktop window: couch mode
# runs maximized and multiplies the session's own scale.
[gui]
couch = true
screen = [3840, 2160]
scale = 2.0

[[step]]
do = "pause"
ms = 1500

[[step]]
do = "key"
text = ""

[[step]]
do = "pause"
ms = 900

[[step]]
do = "key"
text = ""

[[step]]
do = "pause"
ms = 900

[[step]]
do = "key"
text = "\n"

[[step]]
do = "pause"
ms = 1200

[[step]]
do = "key"
text = ""

[[step]]
do = "pause"
ms = 900

[[step]]
do = "key"
text = ""

[[step]]
do = "pause"
ms = 900

[[step]]
do = "key"
text = ""

[[step]]
do = "pause"
ms = 2000

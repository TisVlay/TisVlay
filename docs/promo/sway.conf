# The headless compositor a capture runs in: one 4K output at scale 2,
# so the settings window lays out as at 1080p with twice the pixels, and
# fills the screen with no decoration.
xwayland disable
output HEADLESS-1 mode 3840x2160@60Hz scale 2 bg #141618 solid_color
default_border none
default_floating_border none
for_window [app_id=".*"] fullscreen enable

# The headless compositor a capture runs in. Its one output is exactly
# the settings window at its default size, 720x480, at four times the
# pixels: the window fills it, so the clip is the window and nothing
# else, as large in the frame as a user sees it on opening it.
xwayland disable
output HEADLESS-1 mode 2880x1920@60Hz scale 4 bg #141618 solid_color
default_border none
default_floating_border none
for_window [app_id=".*"] fullscreen enable

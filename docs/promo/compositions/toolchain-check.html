<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Toolchain check</title>
    <style>
      @font-face { font-family: "Inter"; src: url("../build/fonts/Inter.ttf"); font-weight: 100 900; }
      html, body { margin: 0; background: #101418; }
      #check { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; color: #eff0f1; }
      #clip { position: absolute; left: 80px; top: 180px; width: 1280px; height: 720px; }
      #title { position: absolute; left: 80px; top: 60px; font-size: 64px; font-weight: 600; opacity: 0; }
      #box { position: absolute; left: 1440px; top: 180px; width: 160px; height: 160px; background: #3daee9; border-radius: 16px; }
      #frame { position: absolute; left: 1440px; top: 760px; font-size: 96px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <!-- Proves the render path: an HTML animation, an embedded clip whose
         burned-in frame number must match the page's own counter, and an
         audio track. `just promo-check` reads the stills back. -->
    <div id="check" data-composition-id="check" data-width="1920" data-height="1080" data-fps="30" data-start="0" data-duration="4">
      <div id="title" class="clip" data-start="0" data-duration="4">TisVlay promo toolchain</div>
      <video id="clip" class="clip" src="../build/check/counter.mp4" muted playsinline data-start="0" data-duration="4"></video>
      <audio id="tone" src="../build/check/tone.wav" data-start="0" data-duration="4" data-volume="0.5"></audio>
      <div id="box" class="clip" data-start="0" data-duration="4"></div>
      <div id="frame" class="clip" data-start="0" data-duration="4">0</div>
    </div>
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#title", { opacity: 1, duration: 0.5 }, 0);
      tl.to("#box", { y: 400, rotation: 180, duration: 4, ease: "none" }, 0);
      // The page's own frame counter, next to the clip's burned-in one.
      const counter = { frame: 0 };
      tl.to(counter, {
        frame: 120, duration: 4, ease: "none",
        onUpdate: () => { document.querySelector("#frame").textContent = Math.round(counter.frame); },
      }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["check"] = tl;
    </script>
  </body>
</html>

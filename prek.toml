[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", priority = 0 },
  { id = "check-merge-conflict", priority = 0 },
  { id = "check-toml", priority = 0 },
  { id = "check-yaml", priority = 0 },
  { id = "end-of-file-fixer", priority = 0 },
  { id = "trailing-whitespace", priority = 0 },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt", language = "system", entry = "just fmt", files = '\.rs$', pass_filenames = false, priority = 1 },
  { id = "cargo-build", name = "cargo build", language = "system", entry = "just build", always_run = true, pass_filenames = false, priority = 2 },
  { id = "cargo-clippy", name = "cargo clippy", language = "system", entry = "just clippy", always_run = true, pass_filenames = false, priority = 3 },
  { id = "cargo-test", name = "cargo test", language = "system", entry = "just test", always_run = true, pass_filenames = false, priority = 4 },
]

# Per-workspace cargo config.
#
# Single source of truth for build-time env vars. Cargo reads this
# file from the workspace root for every invocation — `just build`,
# bare `cargo test`, rust-analyzer, IDE check-on-save, CI workflow
# steps — so any env var that needs to apply uniformly across all
# build paths goes here, not in justfile recipes (which only catch
# the just-invoked subset) or workflow `env:` blocks (which only
# catch CI).
#
# Slint's element-id debug info isn't set here: [env] can't vary by
# profile, and release builds ship without it, so tisvlay-gui's build.rs
# decides per profile.
[env]
# Default LLVM coverage-runtime output path. Without this,
# instrumented test binaries (which can sneak into `target/debug/`
# from past `cargo llvm-cov` invocations that didn't isolate to
# `target/llvm-cov-target/`) write `default_<hash>_<pid>.profraw`
# to whatever cwd they're spawned from — under nextest that's the
# per-crate directory, leaving stray artifacts outside `target/`
# that survive `cargo clean` / `rm -rf target/`.
#
# Routing the default under `target/` keeps the workspace clean by
# default and preserves the invariant that `rm -rf target/` removes
# all build-time outputs. The `cargo llvm-cov` tool exports its own
# `LLVM_PROFILE_FILE` before invoking cargo, which shadows this
# default (cargo `[env]` only applies when the var isn't already
# set), so coverage runs through `just cov` / `just test-ci`
# continue to write wherever the tool expects.
#
# `%m` (module hash) and `%p` (pid) are compiler-rt's standard
# substitutions; they prevent collisions across parallel test
# processes. `relative = true` resolves the value against the
# workspace root.
LLVM_PROFILE_FILE = { value = "target/profraw/default_%m_%p.profraw", relative = true }
# clippy's config lives in `.config/clippy.toml`, a directory clippy
# doesn't search on its own. Set here rather than in the justfile so a
# bare `cargo clippy` gets the same test allowances as `just clippy`.
# The Nix package build reads this file but never runs clippy.
CLIPPY_CONF_DIR = { value = ".config", relative = true }

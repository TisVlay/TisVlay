[workspace]
resolver = "3"
members = [
    "crates/tvnext-wire",
    "crates/tvnext-world",
    "crates/tvnext-daemon",
    "crates/tvnext-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
bevy_ecs = "0.19"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zenoh = "1.9"

# Path deps into the parent workspace: the vendor-agnostic core and the mock
# backend. Both build without D-Bus (core's `dbus` feature is opt-in).
tisvlay-core = { path = "../../crates/tisvlay-core" }
tisvlay-mock = { path = "../../crates/tisvlay-mock" }

tvnext-wire = { path = "crates/tvnext-wire" }
tvnext-world = { path = "crates/tvnext-world" }
tvnext-daemon = { path = "crates/tvnext-daemon" }

[workspace.lints.rust]
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

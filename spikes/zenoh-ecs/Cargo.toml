[workspace]
resolver = "3"
members = [
    "crates/tvnext-wire",
    "crates/tvnext-world",
    "crates/tvnext-daemon",
    "crates/tvnext-session",
    "crates/tvnext-greeter",
    "crates/tvnext-tray",
    "crates/tvnext-client",
    "crates/tvnext-gui",
    "crates/tvnext-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bevy_ecs = "0.19"
clap = { version = "4", features = ["derive"] }
directories = "6"
edidkit = "0.1"
futures-util = "0.3"
ksni = "0.3"
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }
netlink-packet-core = "0.8"
netlink-packet-route = "0.30"
rtnetlink = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zenoh = "1.9"
# The advanced pub/sub API (caches, history, recovery) is behind `unstable` —
# an accepted spike risk, tracked in the plan's watch items.
zenoh-ext = { version = "1.9", features = ["unstable"] }

# Dev-only: private dbus-daemon + logind/screensaver fakes from the parent
# workspace, for testing the consumed-D-Bus adapters.
tisvlay-test = { path = "../../crates/tisvlay-test" }

# Path deps into the parent workspace: the vendor-agnostic core plus the
# mock and real vendor backends. All build without D-Bus (core's `dbus`
# feature is opt-in).
tisvlay-cec = { path = "../../crates/tisvlay-cec" }
tisvlay-core = { path = "../../crates/tisvlay-core" }
tisvlay-lg = { path = "../../crates/tisvlay-lg", features = ["discovery"] }
tisvlay-mock = { path = "../../crates/tisvlay-mock" }

tvnext-wire = { path = "crates/tvnext-wire" }
tvnext-world = { path = "crates/tvnext-world" }
tvnext-daemon = { path = "crates/tvnext-daemon" }
tvnext-session = { path = "crates/tvnext-session" }
tvnext-tray = { path = "crates/tvnext-tray" }
tvnext-client = { path = "crates/tvnext-client" }

[workspace.lints.rust]
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

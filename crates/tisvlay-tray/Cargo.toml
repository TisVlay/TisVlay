[package]
name = "tisvlay-tray"
description = "System tray app for TV control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tisvlay-tray"
path = "src/main.rs"

[dependencies]
tisvlay-core = { workspace = true, features = ["dbus", "logging"] }
tokio = { workspace = true }
ksni = "0.3"
tracing = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
# Hosts our own minimal `org.tisvlay.Tray1` introspection surface so
# the GUI's About pane can report the tray's online status, version,
# and resolved config path symmetrically with the daemon and session.
zbus = { workspace = true }
# xdg-activation-v1 token acquisition for the "Settings" tray
# action so KWin Plasma 6.5+ can raise the GUI window past focus-
# stealing prevention. Same wayland-* crates the session uses for
# the idle-notifier subscription; the staging feature group carries
# xdg-activation-v1.
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }

[lints]
workspace = true

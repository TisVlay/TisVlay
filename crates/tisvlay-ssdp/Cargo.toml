[package]
name = "tisvlay-ssdp"
description = "Vendor-neutral async SSDP M-SEARCH client with a configurable source-port bind, for firewall-friendly discovery on Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["ssdp", "upnp", "discovery", "multicast", "async"]

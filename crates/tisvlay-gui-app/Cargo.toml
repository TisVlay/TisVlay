[package]
name = "tisvlay-gui-app"
description = "TisVlay settings + management GUI (Slint): state, rpcs, and the binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library keeps the `tisvlay_gui` name — module paths, log targets and
# the integration tests' imports read as the GUI — while the package name
# leaves `tisvlay-gui` to the compiled-UI crate, whose package name Slint
# uses as the gettext domain.
[lib]
name = "tisvlay_gui"
path = "src/lib.rs"

[[bin]]
name = "tisvlay-gui"
path = "src/main.rs"

[dependencies]
# The Slint-generated UI, compiled in its own crate so its large generated
# code builds in parallel with the zenoh/SDK chain below.
tisvlay-gui = { workspace = true }
# Transport-free core types (profiles, schema, capabilities, helpers);
# the D-Bus client surface is replaced by tisvlay.
tisvlay-core = { workspace = true }
tisvlay-runtime = { workspace = true, features = ["logging", "access", "client"] }
tisvlay = { workspace = true }
tisvlay-protocol = { workspace = true }
tisvlay-icons = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
parking_lot = "0.12"
fontique = { workspace = true }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "settings"] }
wl-clipboard-rs = "0.9"
gettext-rs = "0.8"
webbrowser = "1"
tempfile = { workspace = true }
os_info = { version = "3", default-features = false }
rustix = { version = "1", features = ["system"] }
libc = "0.2"
zbus = { workspace = true }

[dev-dependencies]
# Headless Slint backend for element-tree tests; preliminary API, so
# pinned exactly with slint.
i-slint-backend-testing = "=1.18.1"

[lints]
workspace = true

[package]
name = "tisvlay-gui"
description = "TisVlay settings + management GUI (Slint)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tisvlay-gui"
path = "src/main.rs"

[dependencies]
# Transport-free core types (profiles, schema, capabilities, helpers);
# the D-Bus client surface is replaced by tisvlay.
tisvlay-core = { workspace = true, features = ["logging"] }
tisvlay = { workspace = true }
tisvlay-wire = { workspace = true }
tisvlay-icons = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
# Wayland-only winit backend, same rationale as the root GUI (the
# session stack is Wayland-only; dropping the X11 backend keeps
# x11rb off the cold-build path). `unstable-winit-030` is pinned
# exactly with slint — see the root crate's comment block for the
# audit checklist.
slint = { version = "=1.17.0", default-features = false, features = ["std", "backend-winit-wayland", "compat-1-2", "renderer-femtovg", "gettext", "unstable-winit-030"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
parking_lot = "0.12"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "settings"] }
wl-clipboard-rs = "0.9"
gettext-rs = "0.7"
webbrowser = "1"
tempfile = { workspace = true }
os_info = { version = "3", default-features = false }
rustix = { version = "1", features = ["system"] }
libc = "0.2"
zbus = { workspace = true }

[dev-dependencies]
# Headless Slint backend for element-tree tests; preliminary API, so
# pinned exactly with slint.
i-slint-backend-testing = "=1.17.0"

[build-dependencies]
slint-build = "=1.17.0"

[lints]
workspace = true

# `cargo machete` flags `gettext-rs` as unused because the Rust source
# imports it as `gettextrs::gettext` (Cargo names use `-`, the Rust crate
# alias drops it; machete doesn't reconcile).
[package.metadata.cargo-machete]
ignored = ["gettext-rs"]

[package]
name = "tisvlay-gui"
description = "TisVlay settings + management GUI: the compiled Slint UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Only the generated UI lives here (ui/*.slint → `include_modules!`), so it
# depends on nothing but slint and compiles alongside the zenoh/SDK chain;
# tisvlay-gui-app drives it. Slint takes the gettext domain from this
# package's name, which is why the UI — not the app — is `tisvlay-gui`.
[lib]
name = "tisvlay_gui_ui"
path = "src/lib.rs"

[dependencies]
slint = { workspace = true }

[build-dependencies]
slint-build = "=1.18.1"

[lints]
workspace = true

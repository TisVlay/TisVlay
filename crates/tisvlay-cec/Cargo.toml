[package]
name = "tisvlay-cec"
description = "HDMI-CEC vendor backend for tisvlay (Linux CEC subsystem via linux-cec)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tisvlay-core = { workspace = true }

# Valve's Linux CEC userspace library (crates.io; LGPL-2.1-or-later — see
# packaging/licensing). `async` pulls the tokio `AsyncDevice` wrapper.
linux-cec = { workspace = true }

# ABI-stable `EACCES`/`EPERM` constants to classify a `/dev/cecN` open
# failure into a typed `Error::PermissionDenied` (see `map_open_err`).
libc = { workspace = true }

tokio = { workspace = true }
async-trait = { workspace = true }

serde = { workspace = true }
toml = { workspace = true }

tracing = { workspace = true }

# Interior mutability for the scripted FakeCecLink; a dev-dependency for
# in-crate tests, pulled into normal builds only by `test-link`.
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# `test-util` gives `#[tokio::test(start_paused = true)]` so the
# wake-and-connect verify loop's sleeps run in virtual time.
tokio = { workspace = true, features = ["test-util"] }
# Interior mutability for the scripted FakeCecLink.
parking_lot = { workspace = true }
# Fixture directory of fake `cecN` nodes for the discovery tests.
tempfile = { workspace = true }

[lints]
workspace = true

[features]
# Exposes the FakeCecLink/FakeCecLinkOpener test doubles and the
# CecConnector::with_fake_opener constructor for out-of-crate tests.
test-link = ["dep:parking_lot"]

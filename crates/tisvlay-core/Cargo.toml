[package]
name = "tisvlay-core"
description = "Core library for LG WebOS TV control via SSAP protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }
directories = { workspace = true }

# Optional: SSDP discovery
ssdp-client = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# Optional: D-Bus client for tisvlayd
zbus = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[features]
default = []
discovery = ["dep:ssdp-client", "dep:urlencoding", "dep:url"]
dbus = ["dep:zbus", "dep:anyhow"]

[package]
name = "tisvlay-core"
description = "Core library for multi-vendor TV control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }
directories = { workspace = true }

# Multi-vendor abstractions
async-trait = { workspace = true }
bitflags = { workspace = true }

# Stable per-TV identifiers (UUID v4)
uuid = { workspace = true }

# Sync mutex without poisoning (Reconciler, ReconcilerMap, Coalescer).
parking_lot = { workspace = true }

# Optional: D-Bus client for tisvlayd
zbus = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# Optional: logging init for binaries
tracing-subscriber = { workspace = true, optional = true }
tracing-journald = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
zbus = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tisvlay-test = { workspace = true }

[features]
default = []
dbus = ["dep:zbus", "dep:anyhow", "dep:futures-util"]
logging = ["dep:tracing-subscriber", "dep:tracing-journald", "dep:anyhow"]

[lints]
workspace = true

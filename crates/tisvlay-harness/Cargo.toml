[package]
name = "tisvlay-harness"
description = "Integration-test harness: TestDaemon, TestSession, TestTray fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# Shared primitives from the workspace test layer.
tisvlay-test = { workspace = true }
tisvlay-mock = { workspace = true }

# Core types referenced by the fixtures (SystemConfig, TvConfig).
tisvlay-core = { workspace = true }

# Backend registry — TestDaemon wires a mock registry, which needs the
# `mock` feature on this crate.
tisvlay-backends = { workspace = true, features = ["mock"] }

# Binary crates whose fixtures live here. Each exposes a
# `#[doc(hidden)] pub mod __internals` surface for the harness to reach.
tisvlayd = { workspace = true }
tisvlay-session = { workspace = true }

# Async runtime + D-Bus + misc for harness helpers.
tokio = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tempfile = "3"

[lints]
workspace = true

[package]
name = "tisvlay-harness"
description = "Integration-test harness: TestDaemon, TestSession, TestTray fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
# Shared primitives from the workspace test layer.
tisvlay-test = { workspace = true }

# Core types referenced by the fixtures (SystemConfig, TvConfig).
tisvlay-core = { workspace = true }

# Backend registry — TestDaemon wires a mock registry, which needs the
# `mock` feature on this crate.
tisvlay-backends = { workspace = true, features = ["mock"] }

# Binary crates whose fixtures live here. Each exposes a
# `#[doc(hidden)] pub mod __internals` surface for the harness to reach.
tisvlayd = { workspace = true }
tisvlay-session = { workspace = true }
# `tisvlay-gui` is a hybrid lib + bin crate; the harness depends on
# the library target for `TestGui` (Slint AppWindow types, the
# `state::convert_snapshot` view-model converter, etc.).
tisvlay-gui = { workspace = true }
# Slint testing backend, paired with the GUI's pinned `=1.17.0`
# dev-dep. The fixture initializes it once-per-process via a
# `OnceLock` guard so multiple harness consumers don't double-init.
i-slint-backend-testing = "=1.17.0"
slint = { version = "=1.17.0", default-features = false, features = ["std", "compat-1-2"] }

# Async runtime + D-Bus + misc for harness helpers.
tokio = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true

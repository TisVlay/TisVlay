[package]
name = "tisvlay-cli"
description = "TisVlay CLI: multi-vendor TV control from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tisvlay"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
# unstable-ext: the derive `#[arg(add = …)]` value-candidate attribute
# maps to Arg::add, which is gated behind it.
clap = { workspace = true, features = ["unstable-ext"] }
clap_complete = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tisvlay-core = { workspace = true, features = ["access"] }
tisvlay-wire = { workspace = true }
uuid = { workspace = true }
zenoh = { workspace = true }
zenoh-ext = { workspace = true }

[lints]
workspace = true

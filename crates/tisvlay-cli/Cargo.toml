[package]
name = "tisvlay-cli"
description = "TisVlay CLI: multi-vendor TV control from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tisvlay_cli"
path = "src/lib.rs"

[[bin]]
name = "tisvlay"
path = "src/main.rs"

# The gen-cli-docs helper renders the clap tree (in this crate's lib
# target) to Markdown for the CLI reference (`just docs-cli`). Gated
# behind `gen-docs` (optional clap-markdown) so clap-markdown never links
# into the shipped `tisvlay` binary; the docs CI job builds it with
# `--features gen-docs` and pulls only the CLI, not the GUI stack.
[[bin]]
name = "gen-cli-docs"
path = "src/bin/gen-cli-docs.rs"
required-features = ["gen-docs"]

[features]
gen-docs = ["dep:clap-markdown"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tisvlay-wire = { workspace = true }
uuid = { workspace = true }
zenoh = { workspace = true }
zenoh-ext = { workspace = true }

# CLI-reference Markdown generator; optional + gen-docs-gated (see the
# gen-cli-docs bin) so it never links into the shipped binary.
clap-markdown = { version = "0.1", optional = true }

[lints]
workspace = true

[package]
name = "tisvlay-cli"
description = "CLI tool for TV control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "tisvlay_cli"
path = "src/lib.rs"

[[bin]]
name = "tisvlay"
path = "src/main.rs"

# The gen-cli-docs helper renders the clap tree to Markdown for the CLI
# reference (`just docs-cli`). Gated behind `gen-docs` (optional
# clap-markdown) so it stays out of the shipped `tisvlay` binary, and so
# generating the docs builds only the CLI — not the dev-dependency graph
# (tisvlay-harness → Slint → fontconfig), which the minimal docs CI job
# can't build.
[[bin]]
name = "gen-cli-docs"
path = "src/bin/gen-cli-docs.rs"
required-features = ["gen-docs"]

[features]
gen-docs = ["dep:clap-markdown"]

[dependencies]
tisvlay-core = { workspace = true, features = ["dbus"] }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }

# CLI-reference Markdown generator; optional + gen-docs-gated (see the
# gen-cli-docs bin) so it never links into the shipped binary.
clap-markdown = { version = "0.1", optional = true }

[dev-dependencies]
tisvlay-harness = { workspace = true }
tisvlay-test = { workspace = true }
tisvlay-backends = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
insta = { workspace = true }
insta-cmd = { workspace = true }

[lints]
workspace = true

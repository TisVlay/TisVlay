[package]
name = "tisvlay-cli"
description = "TisVlay CLI: multi-vendor TV control from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nfpm]
name = "tisvlay"
# The whole distribution, not just this crate's CLI: cargo-nfpm would
# otherwise use the crate description above.
description = "Multi-vendor TV control for Linux desktops: daemon, session services, tray, GUI and CLI"
section = "utils"
priority = "optional"

contents = [
    # Binaries: `tisvlay` (the CLI and every headless service) is auto-added
    # by cargo-nfpm from the -p target; the GUI is its own.
    { src = "target/x86_64-unknown-linux-gnu/dist/tisvlay-gui", dst = "/usr/bin/tisvlay-gui" },
    # Systemd system service. The activated tisvlay-daemon runs as the
    # dedicated `tisvlay` system user (postinstall.sh creates it), owning
    # the zenoh socket in /run/tisvlay/. Clients join the tisvlay group.
    { src = "packaging/systemd/tisvlay-daemon.service", dst = "/usr/lib/systemd/system/tisvlay-daemon.service" },
    # Systemd user services
    { src = "packaging/systemd/tisvlay-session.service", dst = "/usr/lib/systemd/user/tisvlay-session.service" },
    # Greeter idle client, one unit per display manager (each hangs off that
    # DM's greeter-only session target). postinstall.sh enables the GDM variant
    # and grants its `gdm` user socket access; the plasma-login variant ships
    # for manual/NixOS use (services.tisvlay.greeter.enable). Only the unit
    # whose target activates in a given greeter session runs.
    { src = "packaging/systemd/tisvlay-greeter.service", dst = "/usr/lib/systemd/user/tisvlay-greeter.service" },
    { src = "packaging/systemd/tisvlay-greeter-gdm.service", dst = "/usr/lib/systemd/user/tisvlay-greeter-gdm.service" },
    { src = "packaging/systemd/tisvlay-tray.service", dst = "/usr/lib/systemd/user/tisvlay-tray.service" },
    # D-Bus activation service on the session bus — tisvlay-gui
    # runs as the calling user. Auto-spawns on Activate() from
    # KRunner / Plasma app menu / the tray's "Settings" /
    # `gdbus call …` against the org.tisvlay.Gui bus name.
    { src = "packaging/systemd/org.tisvlay.Gui.service", dst = "/usr/share/dbus-1/services/org.tisvlay.Gui.service" },
    # Desktop entry — the basename must match the bus name when
    # DBusActivatable=true (freedesktop Desktop Entry spec).
    { src = "packaging/freedesktop/org.tisvlay.Gui.desktop", dst = "/usr/share/applications/org.tisvlay.Gui.desktop" },
    # Third-party FOSS attribution. Regenerated at the repo root by
    # `just licenses-html` (a prerequisite of every `package-*`
    # recipe), gitignored so it doesn't churn between dep bumps. Lives
    # at /usr/share/doc/tisvlay/ so distro audit tools (rpm-sequoia,
    # lintian) find it via the conventional path.
    { src = "packaging/licensing/THIRD-PARTY-LICENSES.html", dst = "/usr/share/doc/tisvlay/THIRD-PARTY-LICENSES.html" },
    # Project-level NOTICE — our own copyright + Apache-2.0 election.
    # Upstream NOTICE propagation lives inside THIRD-PARTY-LICENSES.html.
    { src = "packaging/licensing/NOTICE", dst = "/usr/share/doc/tisvlay/NOTICE" },
    # Shell-completion bootstraps for the `tisvlay` CLI, generated by
    # `just completions` (a package-* prerequisite). Each is clap_complete's
    # dynamic registration script dropped into the shell's autoload dir —
    # note the shell-native destination names — and calls back into the
    # binary at <TAB> for live values (see packaging/README.md).
    { src = "packaging/completions/tisvlay.bash", dst = "/usr/share/bash-completion/completions/tisvlay" },
    { src = "packaging/completions/tisvlay.zsh", dst = "/usr/share/zsh/site-functions/_tisvlay" },
    { src = "packaging/completions/tisvlay.fish", dst = "/usr/share/fish/vendor_completions.d/tisvlay.fish" },
]

[package.metadata.nfpm.scripts]
postinstall = "packaging/scripts/postinstall.sh"
preremove = "packaging/scripts/preremove.sh"

# Runtime deps. Daemons / CLI / session / tray only need glibc; the GUI
# additionally links fontconfig at load time and dlopens libGL/libEGL
# and libwayland-{client,egl} at startup (Slint femtovg + winit's
# Wayland backend). Names follow Debian/Ubuntu (deb) and Fedora/RHEL
# (rpm) conventions — verify against the target distro before each
# release.
#
# These MUST live under `overrides.<packager>`, mirroring nfpm's own
# schema: cargo-nfpm's per-format `[nfpm.deb]`/`[nfpm.rpm]` tables have
# no `depends`/`recommends` field, so keys placed there are silently
# dropped (no runtime deps end up in the package). `overrides.deb` /
# `overrides.rpm` is the field nfpm applies per `--packager`.
[package.metadata.nfpm.overrides.deb]
depends = [
    "libc6",
    "libfontconfig1",
    "libgl1",
    "libegl1",
    "libwayland-client0",
    "libwayland-egl1",
]
# Weak: pulls the bash-completion loader so the shipped bootstrap
# autoloads out of the box (apt installs Recommends by default). Not a
# hard dep — completions are a passive enhancement (zsh/fish need none).
recommends = ["bash-completion"]
# GNOME-only: the tray icon needs a StatusNotifier host, which vanilla
# GNOME lacks (KDE/Plasma ships one; Ubuntu bundles its own). Suggests,
# not Recommends — the extension hard-depends on gnome-shell, so a weak
# Recommends would drag the whole shell onto KDE/other installs. The tray
# runs headless without it (menu mirror, notifications, GUI link all work)
# and logs a pointer to it.
suggests = ["gnome-shell-extension-appindicator"]

[package.metadata.nfpm.overrides.rpm]
depends = [
    "glibc",
    "fontconfig",
    "mesa-libGL",
    "mesa-libEGL",
    "libwayland-client",
    "libwayland-egl",
]
# Weak dependency (RPM Recommends) on the bash-completion loader; not
# hard, matching the deb side.
recommends = ["bash-completion"]
# Optional AppIndicator extension for a visible tray icon on GNOME; see
# the deb override above for the Suggests-not-Recommends rationale.
suggests = ["gnome-shell-extension-appindicator"]

# No archlinux override: cargo-nfpm's archlinux packager emits no weak
# deps (a `suggests` there is silently dropped, and it produces no
# optdepend), so Arch GNOME users get the AppIndicator pointer from the
# tray's journal log and packaging/README instead. Arch also ships no
# runtime `depends` for the same reason.

[lib]
name = "tisvlay_cli"
path = "src/lib.rs"

[[bin]]
name = "tisvlay"
path = "src/main.rs"
# The SDK library is also named `tisvlay`; documenting both writes the same
# `target/doc/tisvlay/` page, and rustdoc warns on the collision. The CLI's
# reference lives in its `--help` and the user guide, not in rustdoc.
doc = false

[dependencies]
anyhow = { workspace = true }
# unstable-ext: the derive `#[arg(add = …)]` value-candidate attribute
# maps to Arg::add, which is gated behind it.
clap = { workspace = true, features = ["unstable-ext"] }
clap_complete = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tisvlay-core = { workspace = true }
# The services `tisvlay service <name>` runs.
tisvlay-daemon = { workspace = true }
tisvlay-greeter = { workspace = true }
tisvlay-session = { workspace = true }
tisvlay-tray = { workspace = true }
tisvlay-runtime = { workspace = true, features = ["access"] }
tisvlay-protocol = { workspace = true }
uuid = { workspace = true }
zenoh = { workspace = true }
zenoh-ext = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
tempfile = { workspace = true }
tisvlay-mock = { workspace = true }

[lints]
workspace = true

[package]
name = "tisvlay-cli"
description = "CLI tool for TV control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "tisvlay_cli"
path = "src/lib.rs"

[[bin]]
name = "tisvlay"
path = "src/main.rs"

[dependencies]
tisvlay-core = { workspace = true, features = ["dbus"] }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tisvlay-harness = { workspace = true }
tisvlay-test = { workspace = true }
tisvlay-backends = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
insta = { workspace = true }
insta-cmd = { workspace = true }
# Renders the clap command tree to Markdown for the mdBook CLI reference
# (used only by examples/gen-cli-docs.rs; never linked into the binary).
clap-markdown = "0.1"

[lints]
workspace = true

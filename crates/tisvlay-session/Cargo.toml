[package]
name = "tisvlay-session"
description = "User session service for TV control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "tisvlay_session"
path = "src/lib.rs"

[[bin]]
name = "tisvlay-session"
path = "src/main.rs"

[dependencies]
# Wayland idle detection (greeter wake) comes from tisvlay-core's `wayland` feature.
tisvlay-core = { workspace = true, features = ["dbus", "logging", "wayland"] }
tokio = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tisvlay-harness = { workspace = true }
tisvlay-test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

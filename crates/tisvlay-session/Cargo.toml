[package]
name = "tisvlay-session"
description = "User session service for TV control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "tisvlay_session"
path = "src/lib.rs"

[[bin]]
name = "tisvlay-session"
path = "src/main.rs"

[dependencies]
tisvlay-core = { workspace = true, features = ["dbus", "logging"] }
tokio = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }

# Wayland idle detection (greeter wake on Wayland compositors)
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }

[features]
default = []
# Include the in-memory mock backend for integration tests.
mock = ["dep:tisvlayd", "dep:tisvlay-test-support", "tisvlayd/mock"]

[dependencies.tisvlayd]
path = "../tisvlayd"
optional = true

[dependencies.tisvlay-test-support]
workspace = true
optional = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

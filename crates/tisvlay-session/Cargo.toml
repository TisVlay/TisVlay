[package]
name = "tisvlay-session"
description = "User session service for TV control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "tisvlay_session"
path = "src/lib.rs"

[[bin]]
name = "tisvlay-session"
path = "src/main.rs"

[dependencies]
tisvlay-core = { workspace = true, features = ["dbus", "logging"] }
tokio = { workspace = true }
zbus = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }

# Wayland idle detection (greeter wake on Wayland compositors)
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }

[features]
default = []
# Enables the in-crate integration-test harness module
# (`src/test_harness.rs`) which composes a TestDaemon from
# tisvlay-harness.
mock = ["dep:tisvlay-harness", "dep:tisvlay-test"]

[dependencies.tisvlay-harness]
workspace = true
optional = true

[dependencies.tisvlay-test]
workspace = true
optional = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

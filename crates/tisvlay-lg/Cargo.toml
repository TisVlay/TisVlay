[package]
name = "tisvlay-lg"
description = "LG WebOS TV backend for tisvlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Core abstractions
tisvlay-core = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Logging
tracing = { workspace = true }

# Sync mutex without poisoning (request-pending map + test server).
parking_lot = { workspace = true }

# Optional: SSDP discovery
tisvlay-ssdp = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }

[features]
default = []
discovery = ["dep:tisvlay-ssdp", "dep:urlencoding", "dep:url"]

[lints]
workspace = true

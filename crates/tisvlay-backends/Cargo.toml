[package]
name = "tisvlay-backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = true
description = "Backend registry for tisvlay - composition crate for all vendor implementations"
keywords = ["tisvlay", "backends", "registry"]

[features]
default = []
discovery = ["tisvlay-lg/discovery"]
# Include the in-memory mock backend.
#
# Default-off in release builds (not in distro packages), default-on in
# the workspace dev-dependencies so integration tests always have it.
mock = ["dep:tisvlay-mock"]

[dependencies]
# Core traits and types
tisvlay-core.workspace = true

# Vendor implementations (only this crate imports these)
tisvlay-lg.workspace = true
tisvlay-mock = { workspace = true, optional = true }

# Serialization
toml.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

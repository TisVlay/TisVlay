[package]
name = "tisvlayd"
description = "System daemon for LG WebOS TV control via D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tisvlayd"
path = "src/main.rs"

[features]
default = ["discovery"]
discovery = ["tisvlay-backends/discovery"]

[dependencies]
tisvlay-core = { workspace = true }
tisvlay-backends = { workspace = true }
# tisvlay-lg is accessed through tisvlay-backends, but we need it for LgConfig type
tisvlay-lg = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }

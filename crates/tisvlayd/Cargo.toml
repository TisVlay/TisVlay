[package]
name = "tisvlayd"
description = "System daemon for multi-vendor TV control via D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tisvlayd"
path = "src/main.rs"

[features]
default = ["discovery"]
discovery = ["tisvlay-backends/discovery"]
# Enable the in-memory mock backend in the built binary. Off by default
# in release/distro builds. Integration tests pull their harness from
# the separate `tisvlay-harness` crate (see [dev-dependencies]) rather
# than gating test code inside this crate.
mock = ["tisvlay-backends/mock"]

[dependencies]
tisvlay-core = { workspace = true, features = ["logging"] }
tisvlay-backends = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }
rtnetlink = "0.20"
netlink-packet-core = "0.8"
netlink-packet-route = "0.28"
async-trait = { workspace = true }

# EDID parsing for the desktop probe (DRM-connector ↔ TV matching)
edidkit = "0.1"

[dev-dependencies]
# test-util enables tokio::time::pause/advance for deterministic clock
# control in the TvManager integration tests (B.1.x).
tokio = { workspace = true, features = ["test-util"] }
# Tests use DaemonClient (under the `dbus` feature) to drive the
# in-process daemon over a private bus. Production tisvlayd doesn't
# need the client.
tisvlay-core = { workspace = true, features = ["dbus"] }
# TestDaemon fixture lives in the out-of-crate harness.
tisvlay-harness = { workspace = true }
# Tests that construct `PrivateBus` / `DaemonClient` directly (without
# going through TestDaemon) need this directly.
tisvlay-test = { workspace = true }
# `mock` feature on tisvlay-backends is what TestDaemon needs to wire up
# the in-memory backend; enabled here for integration tests only.
tisvlay-backends = { workspace = true, features = ["mock"] }


# =============================================================================
# Distro packaging via cargo-nfpm
# =============================================================================
# Generates .deb, .rpm, .pkg.tar.zst from a single config.
# Usage: just package-deb | just package-rpm | just package-archlinux
#
# All five binaries are built by `just package-build` with cargo-zigbuild
# against an explicit glibc baseline (see justfile `glibc_baseline`); zig
# is the linker so the ELF interpreter is the standard system path rather
# than a Nix-store path. cargo-nfpm auto-adds the main binary (tisvlayd)
# from target/x86_64-unknown-linux-gnu/release/ via the matching --target
# in the justfile recipes; the others are listed explicitly below.

[package.metadata.nfpm]
name = "tisvlay"
section = "utils"
priority = "optional"

contents = [
    # Binaries (tisvlayd is auto-added by cargo-nfpm from the -p target)
    { src = "target/x86_64-unknown-linux-gnu/release/tisvlay", dst = "/usr/bin/tisvlay" },
    { src = "target/x86_64-unknown-linux-gnu/release/tisvlay-session", dst = "/usr/bin/tisvlay-session" },
    { src = "target/x86_64-unknown-linux-gnu/release/tisvlay-tray", dst = "/usr/bin/tisvlay-tray" },
    { src = "target/x86_64-unknown-linux-gnu/release/tisvlay-gui", dst = "/usr/bin/tisvlay-gui" },
    # Systemd system service
    { src = "packaging/systemd/tisvlayd.service", dst = "/usr/lib/systemd/system/tisvlayd.service" },
    # Systemd user services
    { src = "packaging/systemd/tisvlay-session.service", dst = "/usr/lib/systemd/user/tisvlay-session.service" },
    { src = "packaging/systemd/tisvlay-tray.service", dst = "/usr/lib/systemd/user/tisvlay-tray.service" },
    # D-Bus activation service
    { src = "packaging/systemd/org.tisvlay.Daemon.service", dst = "/usr/share/dbus-1/system-services/org.tisvlay.Daemon.service" },
    # D-Bus policy
    { src = "packaging/systemd/org.tisvlay.Daemon.conf", dst = "/etc/dbus-1/system.d/org.tisvlay.Daemon.conf", type = "config" },
]

[package.metadata.nfpm.scripts]
postinstall = "packaging/scripts/postinstall.sh"
preremove = "packaging/scripts/preremove.sh"

# Runtime deps. Daemons / CLI / session / tray only need glibc; the GUI
# additionally links fontconfig at load time and dlopens libGL/libEGL,
# libwayland-{client,egl}, and libxcb at startup (Slint femtovg + winit).
# Names follow Debian/Ubuntu (deb) and Fedora/RHEL (rpm) conventions —
# verify against the target distro before each release.
[package.metadata.nfpm.deb]
depends = [
    "libc6",
    "libfontconfig1",
    "libgl1",
    "libegl1",
    "libwayland-client0",
    "libwayland-egl1",
    "libxcb1",
]

[package.metadata.nfpm.rpm]
depends = [
    "glibc",
    "fontconfig",
    "mesa-libGL",
    "mesa-libEGL",
    "libwayland-client",
    "libwayland-egl",
    "libxcb",
]

[lints]
workspace = true

[package]
name = "tisvlayd"
description = "System daemon for multi-vendor TV control via D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tisvlayd"
path = "src/main.rs"

[features]
default = ["discovery"]
discovery = ["tisvlay-backends/discovery"]
# Include the in-memory mock backend. Off by default in release/distro
# builds; enabled by dev/test workflows that need the mock vendor.
# Activates the test_harness module and its supporting dev deps too,
# so integration tests under crates/tisvlayd/tests/ can build a
# daemon end-to-end against a private bus.
mock = [
    "tisvlay-backends/mock",
    "dep:tempfile",
    "dep:tisvlay-test",
]

[dependencies]
tisvlay-core = { workspace = true, features = ["logging"] }
tisvlay-backends = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
rtnetlink = "0.20"
netlink-packet-core = "0.8"
netlink-packet-route = "0.28"
# Optional deps activated by the `mock` feature. Pulled in for the
# integration test harness (`crate::test_harness`) but not by the
# default release build.
tempfile = { version = "3", optional = true }
tisvlay-test = { workspace = true, optional = true }

[dev-dependencies]
# test-util enables tokio::time::pause/advance for deterministic clock
# control in the TvManager integration tests (B.1.x).
tokio = { workspace = true, features = ["test-util"] }
# Tests use DaemonClient (under the `dbus` feature) to drive the
# in-process daemon over a private bus. Production tisvlayd doesn't
# need the client.
tisvlay-core = { workspace = true, features = ["dbus"] }


# =============================================================================
# Distro packaging via cargo-nfpm
# =============================================================================
# Generates .deb, .rpm, .pkg.tar.zst from a single config.
# Usage: just package-deb | just package-rpm | just package-archlinux
#
# Paths use the musl target directory directly so packaging never touches
# the native dev build cache at target/release/. cargo-nfpm auto-adds the
# main binary (tisvlayd) using the correct --target path; the other three
# binaries are listed explicitly and must use the same target directory.

[package.metadata.nfpm]
name = "tisvlay"
section = "utils"
priority = "optional"

contents = [
    # Binaries (tisvlayd is auto-added by cargo-nfpm from the -p target)
    { src = "target/x86_64-unknown-linux-musl/release/tisvlay", dst = "/usr/bin/tisvlay" },
    { src = "target/x86_64-unknown-linux-musl/release/tisvlay-session", dst = "/usr/bin/tisvlay-session" },
    { src = "target/x86_64-unknown-linux-musl/release/tisvlay-tray", dst = "/usr/bin/tisvlay-tray" },
    # Systemd system service
    { src = "packaging/systemd/tisvlayd.service", dst = "/usr/lib/systemd/system/tisvlayd.service" },
    # Systemd user services
    { src = "packaging/systemd/tisvlay-session.service", dst = "/usr/lib/systemd/user/tisvlay-session.service" },
    { src = "packaging/systemd/tisvlay-tray.service", dst = "/usr/lib/systemd/user/tisvlay-tray.service" },
    # D-Bus activation service
    { src = "packaging/systemd/org.tisvlay.Daemon.service", dst = "/usr/share/dbus-1/system-services/org.tisvlay.Daemon.service" },
    # D-Bus policy
    { src = "packaging/systemd/org.tisvlay.Daemon.conf", dst = "/etc/dbus-1/system.d/org.tisvlay.Daemon.conf", type = "config" },
]

[package.metadata.nfpm.scripts]
postinstall = "packaging/scripts/postinstall.sh"
preremove = "packaging/scripts/preremove.sh"

[package.metadata.nfpm.deb]
depends = ["libc6"]

[package.metadata.nfpm.rpm]
depends = ["glibc"]
